<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>طلب الباقات - الهندسة المعمارية</title>
  <style>
    body {
      font-family: 'Cairo', Arial, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      max-width: 400px;
      margin: 20px auto;
      text-align: center;
    }
    .card h2 {
      margin-bottom: 10px;
      color: #b30000;
    }
    .btn, button {
      background: #b30000;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 15px;
    }
    .btn:hover, button:hover {
      background: #8a0000;
    }
    form {
      background: #fff;
      max-width: 500px;
      margin: 20px auto;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border-radius: 6px;
      border: 2px solid #ccc;
      font-size: 1rem;
      font-family: 'Cairo', Arial, sans-serif;
    }
    textarea {
      resize: vertical;
    }
    #loadingIndicator {
      display: none;
      text-align: center;
      margin-top: 15px;
    }
    #successBox, #errorBox {
      display: none;
      padding: 12px;
      margin-top: 15px;
      border-radius: 8px;
      text-align: center;
      font-weight: bold;
    }
    #successBox {
      background: #d4edda;
      color: #155724;
    }
    #errorBox {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- بطاقة اختيار الباقة -->
  <div class="card">
    <h2>الباقة الأساسية</h2>
    <p>السعر: 3950 دج</p>
    <button class="btn" type="button" onclick="openForm('الباقة الأساسية', 3950)">
      اطلب الآن
    </button>
  </div>

  <!-- نموذج الطلب (مخفي في البداية) -->
  <div id="formWrap" style="display:none;">
    <form id="orderForm">
      <h2>أكمل بيانات طلبك</h2>

      <input type="hidden" id="package" name="package">
      <input type="hidden" id="price" name="price">

      <label for="name">الاسم الكامل</label>
      <input type="text" id="name" name="name" required placeholder="أدخل اسمك الكامل">

      <label for="phone">رقم الهاتف</label>
      <input type="tel" id="phone" name="phone" required
             placeholder="مثال: 0551234567" pattern="^(\+?213|0)(5|6|7)\d{8}$">

      <label for="wilaya">الولاية</label>
      <input type="text" id="wilaya" name="wilaya" required placeholder="أدخل اسم الولاية">

      <label for="commune">البلدية</label>
      <input type="text" id="commune" name="commune" required placeholder="أدخل اسم البلدية">

      <label for="delivery">نوع التوصيل</label>
      <select id="delivery" name="delivery" required>
        <option value="">-- اختر نوع التوصيل --</option>
        <option value="إلى المنزل">إلى المنزل</option>
        <option value="مكتب البريد">مكتب البريد</option>
      </select>

      <label for="notes">ملاحظات إضافية (اختياري)</label>
      <textarea id="notes" name="notes" rows="3" placeholder="اكتب ملاحظتك"></textarea>

      <button type="submit">إرسال الطلب</button>

      <div id="loadingIndicator">⏳ جاري إرسال الطلب...</div>
      <div id="successBox">✅ تم إرسال طلبك بنجاح! سنتواصل معك قريباً.</div>
      <div id="errorBox">❌ حدث خطأ، حاول مرة أخرى لاحقاً.</div>
    </form>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwMTVOfnvA12Xh0cqSeeDCs7fKUcZR9tZJ4aYpHQSCyg-ZdfecFuDe3lhtFWJQsD1B1/exec";

    function openForm(packName, price) {
      document.getElementById('formWrap').style.display = 'block';
      document.getElementById('package').value = packName;
      document.getElementById('price').value = price;
      document.getElementById('successBox').style.display = 'none';
      document.getElementById('errorBox').style.display = 'none';
      window.scrollTo({ top: document.getElementById('formWrap').offsetTop - 40, behavior: 'smooth' });
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
      e.preventDefault();

      document.getElementById('loadingIndicator').style.display = 'block';
      document.getElementById('successBox').style.display = 'none';
      document.getElementById('errorBox').style.display = 'none';

      const formEl = e.target;
      const formData = new FormData(formEl);
      const obj = {};
      formData.forEach((val, key) => obj[key] = val);

      const flatData = {
        name: obj.name,
        phone: obj.phone,
        wilaya: obj.wilaya,
        commune: obj.commune,
        delivery: obj.delivery,
        package: obj.package,
        notes: obj.notes,
        price: obj.price
      };

      fetch(GAS_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(flatData)
      })
      .then(res => {
        if (!res.ok) throw new Error('Network response was not ok');
        return res.json();
      })
      .then(data => {
        if (data.result === 'success') {
          document.getElementById('successBox').style.display = 'block';
          formEl.reset();
          setTimeout(() => {
            document.getElementById('formWrap').style.display = 'none';
            document.getElementById('loadingIndicator').style.display = 'none';
            document.getElementById('successBox').style.display = 'none';
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }, 4000);
        } else {
          throw new Error('Server error');
        }
      })
      .catch(err => {
        console.error(err);
        document.getElementById('errorBox').style.display = 'block';
        document.getElementById('loadingIndicator').style.display = 'none';
        setTimeout(() => document.getElementById('errorBox').scrollIntoView({ behavior: 'smooth'}), 200);
      });
    });
  </script>
</body>
</html>
