<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>طلب جديد</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff;
      margin: 0;
      padding: 0;
      color: #000;
    }
    header {
      background: #c00;
      color: #fff;
      padding: 15px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
    }
    form {
      max-width: 600px;
      margin: 20px auto;
      background: #f9f9f9;
      border: 2px solid #000;
      border-radius: 10px;
      padding: 20px;
    }
    label {
      display: block;
      margin: 10px 0 5px;
      font-weight: bold;
    }
    input, select, textarea {
      width: 100%;
      padding: 8px;
      border: 1px solid #c00;
      border-radius: 5px;
    }
    button {
      margin-top: 20px;
      padding: 12px;
      background: #c00;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background: #000;
      color: #fff;
    }
    .success, .error {
      text-align: center;
      margin-top: 20px;
      font-weight: bold;
      font-size: 16px;
    }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>

  <header>🛒 نموذج طلب - TRENDY TEAM</header>

  <form id="orderForm">
    <label>الاسم الكامل</label>
    <input type="text" id="fullName" required>

    <label>الهاتف</label>
    <input type="text" id="phone" required>

    <label>تأكيد الهاتف</label>
    <input type="text" id="phoneConfirm">

    <label>الولاية</label>
    <input type="text" id="city" required>

    <label>البلدية</label>
    <input type="text" id="commune">

    <label>المنتج</label>
    <input type="text" id="packType" placeholder="مثال: باك أساسي">

    <label>سعر المنتج</label>
    <input type="number" id="packPrice">

    <label>نوع التوصيل</label>
    <select id="deliveryType">
      <option value="standard">عادي</option>
      <option value="express">سريع</option>
    </select>

    <label>سعر التوصيل</label>
    <input type="number" id="deliveryPrice">

    <label>ملاحظات</label>
    <textarea id="notes"></textarea>

    <button type="submit">إرسال الطلب ✅</button>
  </form>

  <div class="success" id="successMsg" style="display:none;">✅ تم إرسال الطلب بنجاح</div>
  <div class="error" id="errorMsg" style="display:none;">❌ حدث خطأ، حاول مرة أخرى</div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbznTBVwherkrYYXtkbLTe0DGhLM0H8wz9J2hdqZmyb06mZSQxQC9tFhHtwQ24YPH7cS/exec";

    document.getElementById("orderForm").addEventListener("submit", async function(e) {
      e.preventDefault();

      const data = {
        customer: {
          fullName: document.getElementById("fullName").value,
          phone: document.getElementById("phone").value,
          phoneConfirm: document.getElementById("phoneConfirm").value,
          city: document.getElementById("city").value,
          commune: document.getElementById("commune").value,
          notes: document.getElementById("notes").value
        },
        shipping: {
          method: document.getElementById("deliveryType").value,
          fee: document.getElementById("deliveryPrice").value
        },
        pack: {
          type: document.getElementById("packType").value,
          price: document.getElementById("packPrice").value
        },
        totals: {
          total: (Number(document.getElementById("packPrice").value) || 0) + 
                 (Number(document.getElementById("deliveryPrice").value) || 0)
        }
      };

      try {
        let res = await fetch(GAS_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        let result = await res.json();
        if (result.result === "success") {
          document.getElementById("successMsg").style.display = "block";
          document.getElementById("errorMsg").style.display = "none";
          document.getElementById("orderForm").reset();
        } else {
          throw new Error(result.message);
        }
      } catch (err) {
        document.getElementById("errorMsg").style.display = "block";
        document.getElementById("successMsg").style.display = "none";
      }
    });
  </script>
</body>
</html>
