<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boutique - Archi Space</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #fff;
      margin: 0;
      padding: 0;
      color: #000;
    }
    header {
      background-color: #b30000;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 30px;
    }
    .product {
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      padding: 20px;
      text-align: center;
      transition: transform 0.3s ease;
    }
    .product:hover {
      transform: translateY(-5px);
    }
    .product img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
    }
    .product h3 {
      margin: 15px 0 10px;
      color: #b30000;
    }
    .product p {
      font-size: 14px;
      margin: 10px 0;
    }
    .product button {
      background-color: #000;
      color: #fff;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: 0.3s;
    }
    .product button:hover {
      background-color: #b30000;
    }
  </style>
</head>
<body>
  <header>
    <h1>Notre Boutique</h1>
    <p>Commandez vos packs facilement</p>
  </header>

  <div class="container">
    <div class="product">
      <img src="https://via.placeholder.com/250x150" alt="Pack 1">
      <h3>Pack Dessin</h3>
      <p>Contient des outils de dessin pour étudiants en architecture.</p>
      <button onclick="envoyerCommande('Pack Dessin')">Acheter</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/250x150" alt="Pack 2">
      <h3>Pack Maquette</h3>
      <p>Tout le nécessaire pour réaliser vos maquettes facilement.</p>
      <button onclick="envoyerCommande('Pack Maquette')">Acheter</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/250x150" alt="Pack 3">
      <h3>Pack Premium</h3>
      <p>Une sélection complète d’outils et accessoires pro.</p>
      <button onclick="envoyerCommande('Pack Premium')">Acheter</button>
    </div>
  </div>

  <script>
    function envoyerCommande(produit) {
      const url = "https://script.google.com/macros/s/AKfycbzmHDHqpMpEvrwjOQ6aXGU419gWunObR0vM6lF2Bcxhq6bouGnXsfFJvG4zoW5kqbri/exec";

      // البيانات التي سترسل إلى Google Sheets
      const data = {
        produit: produit,
        date: new Date().toLocaleString()
      };

      fetch(url, {
        method: "POST",
        mode: "no-cors",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(data)
      });

      alert("Votre commande pour " + produit + " a été envoyée ✅");
    }
  </script>
</body>
</html>
