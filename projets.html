<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>💼 Projets — Archi.Space (Premium)</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root{ --bg:#0f172a; --card:#0b1220; --muted:#94a3b8; --text:#e5e7eb; --accent:#22d3ee; --accent-2:#38bdf8; --ring:#22d3ee55; --border:#1f2937; --premium:#fbbf24; }
    *{box-sizing:border-box} html,body{height:100%}
    body{ margin:0; background:radial-gradient(1000px 600px at 10% -10%, rgba(34,211,238,.08), transparent 50%), linear-gradient(135deg, var(--bg), var(--card) 60%); color:var(--text); font-family:'Rubik', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }
    .container{max-width:1200px; margin:0 auto; padding:20px}
    .topbar{ display:flex; align-items:center; gap:12px; justify-content:space-between; margin-bottom:18px; background:color-mix(in srgb, var(--card) 92%, transparent); border:1px solid var(--border); border-radius:16px; padding:10px 14px; backdrop-filter: blur(8px); }
    .brand{display:flex; align-items:center; gap:10px; font-weight:800}
    .logo{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-size:20px; background: radial-gradient(120% 120% at 0% 0%, var(--accent) 0%, transparent 60%), radial-gradient(120% 120% at 100% 100%, var(--accent-2) 0%, transparent 60%); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-2) 35%, transparent), 0 10px 20px color-mix(in srgb, var(--accent) 30%, transparent); }
    .search{position:relative; flex:1; max-width:520px}
    .search input{ width:100%; padding:12px 44px; border-radius:12px; background:var(--card); border:1px solid var(--border); color:var(--text); outline:none; font-size:15px; }
    .search .icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.7; pointer-events:none}
    .controls{display:flex; gap:8px}
    .btn{ appearance:none; border:1px solid var(--border); background:var(--card); color:var(--text); border-radius:12px; padding:10px 12px; cursor:pointer; font-weight:600; display:inline-flex; align-items:center; gap:8px; }
    .badge-premium{ display:inline-flex; align-items:center; gap:6px; font-weight:700; color:#0d0d0d; background:linear-gradient(90deg, #fde68a, #fbbf24); padding:6px 10px; border-radius:999px; text-shadow:0 1px 0 rgba(255,255,255,.4); }
    .hero{ margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; background:linear-gradient(180deg, color-mix(in srgb, var(--card) 96%, transparent), transparent); border:1px solid var(--border); border-radius:16px; padding:14px; }
    .hero .title{font-size:20px; font-weight:800} .hero .desc{color:var(--muted); font-size:14px} .hero .actions{display:flex; gap:8px; flex-wrap:wrap}
    .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap:18px; }
    .card{ position:relative; background:linear-gradient(180deg, var(--card), color-mix(in srgb, var(--card) 92%, transparent)); border:1px solid var(--border); border-radius:16px; padding:16px; min-height:220px; box-shadow:0 10px 24px rgba(0,0,0,.12); display:flex; flex-direction:column; gap:10px; }
    .card .icon{position:absolute; top:12px; right:12px; font-size:24px; opacity:.9; filter: drop-shadow(0 2px 6px rgba(0,0,0,.25));}
    .card .title{font-weight:800; line-height:1.3}
    .meta{color:var(--muted); font-size:13px}
    .tech{display:grid; grid-template-columns:1fr; gap:6px; font-size:13px; background:rgba(255,255,255,.02); border:1px dashed var(--border); padding:10px; border-radius:12px}
    .actions{margin-top:auto; display:flex; gap:8px; flex-wrap:wrap}
    .toast{ position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:rgba(15,23,42,.95); color:white; padding:10px 14px; border-radius:12px; border:1px solid var(--border); z-index:80; font-size:14px }
    .app{display:none} .app.ready{display:block}
  </style>
</head>
<body>

  <div class="container app" id="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">💼</div>
        <div>Projets (Premium)</div>
      </div>
      <div class="search">
        <span class="icon">🔎</span>
        <input id="search" type="text" placeholder="Rechercher un projet (titre/nom)…" autocomplete="off"/>
      </div>
      <div class="controls">
        <span class="badge-premium">⭐ Premium</span>
        <a class="btn" href="lecteur.html">🏠 Accueil</a>
        <a class="btn" href="bibliotheque.html">📖 Bibliothèque</a>
        <button id="logoutBtn" class="btn">🚪 Se déconnecter</button>
      </div>
    </div>

    <div class="hero">
      <div>
        <div class="title">Accès réservé — Contenu protégé</div>
        <div class="desc">Accès par <b>code d’achat</b>. Entrez الكود الذي تستلمه بعد الدفع لفتح المشروع.</div>
      </div>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain: "archi-space-72624.firebaseapp.com",
      projectId: "archi-space-72624",
      storageBucket: "archi-space-72624.firebasestorage.app",
      messagingSenderId: "407015246505",
      appId: "1:407015246505:web:c914a78566b882b80df7b8",
      measurementId: "G-RZV7LSDQBD"
    };
    const appFB = initializeApp(firebaseConfig);
    const auth = getAuth(appFB);
    const db = getFirestore(appFB);

    const appRoot = document.getElementById("app");
    const grid = document.getElementById("grid");
    const searchInput = document.getElementById("search");
    const logoutBtn = document.getElementById("logoutBtn");

    const toast = (msg, ms=1600)=>{
      const d = document.createElement("div");
      d.className = "toast"; d.textContent = msg; document.body.appendChild(d);
      setTimeout(()=> d.remove(), ms);
    };

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        const redirect = encodeURIComponent("projets.html");
        window.location.href = `login.html?redirect=${redirect}`;
        return;
      }
      appRoot.classList.add("ready");
      initProjects();
    });

    logoutBtn.addEventListener("click", async ()=>{ await signOut(auth); });

    const projects = [
      {
        id: "rehab-piscine-setif-8mai1945",
        icon: "🏊‍♂️",
        title: "RÉHABILITATION DE LA PISCINE OLYMPIQUE DU 8 MAI 1945 À SÉTIF — Vers un équipement sportif intelligent et durable",
        meta: "PDF — dossier technique",
        tech: { auteur:"wail", niveau:"5ᵉ année — EPAU", encadrement:"—", annee:"2024", motsCles:"réhabilitation, durabilité, smart building" },
        resume: "Transformation d’une piscine olympique historique en équipement durable et intelligent."
      }
    ];

    const escapeHtml = (s)=>s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function ficheTech(t){
      return `<div class="tech">
        <div>👤 Auteur : <b>${escapeHtml(t.auteur||"-")}</b></div>
        <div>🎓 Niveau : <b>${escapeHtml(t.niveau||"-")}</b></div>
        <div>🧑‍🏫 Encadrement : <b>${escapeHtml(t.encadrement||"-")}</b></div>
        <div>📅 Année : <b>${escapeHtml(t.annee||"-")}</b></div>
        <div>🏷️ Mots-clés : <b>${escapeHtml(t.motsCles||"-")}</b></div>
      </div>`;
    }
    function card(p){
      const el = document.createElement("article");
      el.className = "card";
      el.dataset.id = p.id;
      el.innerHTML = `
        <div class="icon">${p.icon || "📁"}</div>
        <div class="title">${escapeHtml(p.title)}</div>
        <div class="meta">⭐ Premium — ${escapeHtml(p.meta || "")}</div>
        ${p.resume ? `<div class="meta">${escapeHtml(p.resume)}</div>` : ""}
        ${p.tech ? ficheTech(p.tech) : ""}
        <div class="actions">
          <button class="btn btn-primary" data-open>🔓 Ouvrir</button>
        </div>`;
      return el;
    }
    function renderProjects(list){
      grid.innerHTML = "";
      if(!list.length){
        const empty = document.createElement("div");
        empty.className = "card";
        empty.innerHTML = `<div class="title">لا توجد مشاريع مطابقة لبحثك.</div>`;
        grid.appendChild(empty);
        return;
      }
      list.forEach(p => grid.appendChild(card(p)));
    }

    function initProjects(){
      renderProjects(projects);
      searchInput.addEventListener("input", ()=>{
        const q = (searchInput.value||"").toLowerCase().trim();
        renderProjects(projects.filter(p => p.title.toLowerCase().includes(q) || (p.tech?.auteur||"").toLowerCase().includes(q)));
      });

      grid.addEventListener("click", async (e)=>{
        const btn = e.target.closest("[data-open]");
        if(!btn) return;
        const card = btn.closest(".card");
        const pId = card.dataset.id;

        const code = prompt("🔒 أدخل كود الولوج (تستلمه بعد الدفع):");
        if(!code) return;

        try{
          const ref = doc(db, "projects", pId, "codes", code.trim());
          const snap = await getDoc(ref);
          if(!snap.exists()){ alert("❌ كود غير صحيح."); return; }
          const data = snap.data();
          const now = Date.now();
          if (data.active === false){ alert("⛔ الكود غير مفعّل."); return; }
          if (data.expiresAt && data.expiresAt.toMillis && now > data.expiresAt.toMillis()){
            alert("⏰ الكود منتهي الصلاحية."); return;
          }
      
          window.location.href = `projet_view.html?pid=${encodeURIComponent(pId)}&code=${encodeURIComponent(code.trim())}`;
        }catch(err){
          console.error(err);
          alert("⚠️ تعذّر التحقق من الكود.");
        }
      });
    }

  
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("dragstart", e => e.preventDefault());
    document.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase(); const ctrl = e.ctrlKey || e.metaKey; const shift = e.shiftKey;
      if ((ctrl && (k==='s'||k==='p'||k==='u'||k==='a'||k==='c'||k==='x'||k==='v'||k==='o')) || (ctrl && shift && (k==='i'||k==='c'||k==='j')) || k==='printscreen'){
        e.preventDefault(); toast("🚫 تم تعطيل الاختصار.");
      }
    });
  </script>
</body>
</html>
