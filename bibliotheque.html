<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>📚 Bibliothèque — Archi.Space</title>
  <style>
    :root{
      --bg:#0f172a; --card:#111827; --muted:#94a3b8; --text:#e5e7eb;
      --accent:#22d3ee; --accent-2:#38bdf8; --ring:#22d3ee55; --border:#1f2937;
    }
    :root.light{
      --bg:#f8fafc; --card:#ffffff; --muted:#64748b; --text:#0f172a;
      --accent:#0891b2; --accent-2:#0ea5e9; --ring:#0ea5e955; --border:#e2e8f0;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:linear-gradient(135deg, var(--bg), var(--card) 60%);
      color:var(--text); font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }
    .container{max-width:1100px; margin:0 auto; padding:24px}
    .nav{
      display:flex; align-items:center; gap:12px; padding:12px 16px;
      background:color-mix(in srgb, var(--card) 92%, transparent);
      border:1px solid var(--border); border-radius:16px; backdrop-filter: blur(8px);
      justify-content:space-between;
    }
    .brand{display:flex; align-items:center; gap:10px; font-weight:800}
    .brand .logo{
      width:36px; height:36px; border-radius:10px; display:grid; place-items:center;
      background: radial-gradient(120% 120% at 0% 0%, var(--accent) 0%, transparent 60%),
                 radial-gradient(120% 120% at 100% 100%, var(--accent-2) 0%, transparent 60%);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-2) 35%, transparent),
                  0 10px 20px color-mix(in srgb, var(--accent) 30%, transparent);
      font-size:18px
    }
    .left{display:flex; align-items:center; gap:12px}
    .controls{display:flex; align-items:center; gap:8px}
    .btn, .chip{
      appearance:none; border:1px solid var(--border); background:var(--card); color:var(--text);
      border-radius:12px; padding:8px 12px; cursor:pointer; font-weight:600;
      display:inline-flex; align-items:center; gap:8px; transition:.2s transform ease,.2s background ease;
    }
    .btn:active{transform:translateY(1px)}
    .btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#001018; border:none}
    .chip{font-size:13px; opacity:.9}
    .search{position:relative; flex:1; max-width:520px}
    .search input{
      width:100%; padding:12px 44px; border-radius:12px; background:var(--card);
      border:1px solid var(--border); color:var(--text); outline:none; font-size:15px;
    }
    .search input:focus{border-color:var(--accent); box-shadow:0 0 0 4px var(--ring)}
    .search .icon{position:absolute; left:12px; top:50%; transform:translateY(-50%); opacity:.7; pointer-events:none}
    .grid{
      display:grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap:18px; margin-top:22px;
    }
    .card{
      background:linear-gradient(180deg, var(--card), color-mix(in srgb, var(--card) 92%, transparent));
      border:1px solid var(--border); border-radius:16px; padding:16px;
      box-shadow: 0 12px 30px rgba(0,0,0,.10);
      display:flex; flex-direction:column; gap:12px; min-height:148px;
    }
    .title{font-weight:700; line-height:1.3; word-break:break-word}
    .meta{color:var(--muted); font-size:13px}
    .actions{margin-top:auto; display:flex; gap:10px}
    .footer{opacity:.7; font-size:12px; margin-top:18px; text-align:center}
  
    .modal{
      position:fixed; inset:0; display:none; place-items:center; background:rgba(2,6,23,.75);
      z-index:50; padding:18px;
    }
    :root.light .modal{background:rgba(15,23,42,.25)}
    .modal.show{display:grid}
    .dialog{
      width:min(1200px, 100%); height:min(86vh, 860px); background:var(--card); border:1px solid var(--border); border-radius:16px;
      box-shadow: 0 25px 80px rgba(0,0,0,.25); display:flex; flex-direction:column; overflow:hidden;
    }
    .dialog-header{
      display:flex; align-items:center; justify-content:space-between; padding:10px 12px; gap:10px; background:color-mix(in srgb, var(--bg) 92%, transparent); border-bottom:1px solid var(--border);
    }
    .dialog-title{font-weight:800; font-size:14px}
    .close{background:var(--card); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:8px 10px; cursor:pointer}
    .pdf-wrap{position:relative; flex:1; background:var(--bg)}
    .pdf-frame{position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg)}
    .shield{position:absolute; top:0; right:0; width:180px; height:52px; z-index:2}
    .empty{
      grid-column:1 / -1; text-align:center; padding:36px; color:var(--muted); border:1px dashed var(--border); border-radius:16px;
      background:color-mix(in srgb, var(--card) 90%, transparent)
    }
    body, img, .pdf-wrap, .pdf-frame { -webkit-user-select:none; user-select:none }
    .app{display:none}
    .app.ready{display:block}
  </style>
</head>
<body>

  <div class="container app" id="app">
    <div class="nav">
      <div class="left">
        <button class="btn chip" id="backBtn">⬅️ Retour</button>
        <div class="brand">
          <div class="logo" aria-hidden="true">📚</div>
          <div>Bibliothèque</div>
        </div>
      </div>
      <div class="search">
        <span class="icon">🔎</span>
        <input id="search" type="text" placeholder="Rechercher un livre… (nom du fichier)" autocomplete="off" />
      </div>
      <div class="controls">
        <button id="themeToggle" class="btn chip" title="Basculer thème">🌗 Mode</button>
      </div>
    </div>

    <div id="grid" class="grid" aria-live="polite"></div>

    <div class="footer"></div>
  </div>


  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
    <div class="dialog">
      <div class="dialog-header">
        <div id="dlgTitle" class="dialog-title">Lecture du PDF</div>
        <div class="dialog-actions">
          <button class="close" id="closeBtn">Fermer ✕</button>
        </div>
      </div>
      <div class="pdf-wrap" oncontextmenu="return false;">
        <div class="shield"></div>
        <iframe id="pdfFrame" class="pdf-frame"
          sandbox="allow-scripts allow-same-origin"
          referrerpolicy="no-referrer"
          allow="clipboard-read; clipboard-write">
        </iframe>
      </div>
    </div>
  </div>

 
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    
    const firebaseConfig = {
      apiKey: "AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain: "archi-space-72624.firebaseapp.com",
      projectId: "archi-space-72624",
      storageBucket: "archi-space-72624.firebasestorage.app",
      messagingSenderId: "407015246505",
      appId: "1:407015246505:web:c914a78566b882b80df7b8",
      measurementId: "G-RZV7LSDQBD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);


    const root = document.documentElement;
    const THEME_KEY = "archispace-theme";
    const setTheme = (mode) => {
      if (mode === "light") root.classList.add("light");
      else root.classList.remove("light");
      localStorage.setItem(THEME_KEY, mode);
    };
    setTheme(localStorage.getItem(THEME_KEY) || "dark");
    document.getElementById("themeToggle").addEventListener("click", () => {
      setTheme(root.classList.contains("light") ? "dark" : "light");
    });

  
    document.getElementById("backBtn").addEventListener("click", () => {
      if (history.length > 1) history.back();
      else window.location.href = "lecteur.html";
    });

  
    const appRoot = document.getElementById("app");
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        const redirect = encodeURIComponent("bibliotheque.html");
        window.location.href = `login.html?redirect=${redirect}`;
        return;
      }
      appRoot.classList.add("ready");
      initLibrary(); 
    });

  
    function initLibrary(){
      const books = [
        {
          name: "Amenager_-terrain_pente_.pdf",
          url: "https://github.com/archiIYA/archi-space/blob/main/Amenager_-terrain_pente_.pdf"
        },
        {
          name: "Livre_4_Amenagement_et_projet_urbain (1).pdf",
          url: "https://github.com/archiIYA/archi-space/blob/main/Livre_4_Amenagement_et_projet_urbain%20(1).pdf"
        }
      ];

 
      const toRawUrl = (blobUrl) => {
        try{
          const u = new URL(blobUrl);
          if (u.hostname === "github.com" && u.pathname.includes("/blob/")) {
            return blobUrl.replace("https://github.com/", "https://raw.githubusercontent.com/").replace("/blob/", "/");
          }
          return blobUrl;
        }catch{ return blobUrl; }
      };

   
      async function loadPdfAsBlob(rawUrl){
        const res = await fetch(rawUrl, {
          mode: "cors",
          credentials: "omit",
          referrerPolicy: "no-referrer",
          headers: { "Accept": "application/pdf" }
        });
        if(!res.ok) throw new Error("HTTP " + res.status);
        const blob = await res.blob();
      
        if (blob.type && !blob.type.includes("pdf")) {
    
        }
        return URL.createObjectURL(blob);
      }

      const grid = document.getElementById("grid");
      const searchInput = document.getElementById("search");
      const modal = document.getElementById("modal");
      const pdfFrame = document.getElementById("pdfFrame");
      const dlgTitle = document.getElementById("dlgTitle");
      const closeBtn = document.getElementById("closeBtn");

      let currentBlobUrl = null;

      const escapeHtml = (s)=>s.replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

      function createCard(book){
        const el = document.createElement("article");
        el.className = "card";
        el.dataset.name = book.name.toLowerCase();
        el.innerHTML = `
          <div class="title">📄 ${escapeHtml(book.name)}</div>
          <div class="meta">Format: PDF</div>
          <div class="actions">
            <button class="btn btn-primary" data-read>📖 Lire</button>
          </div>
        `;
        el.querySelector("[data-read]").addEventListener("click", () => openPdf(book));
        return el;
      }

      function render(list){
        grid.innerHTML = "";
        if(!list.length){
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "لا توجد نتائج مطابقة لبحثك.";
          grid.appendChild(empty);
          return;
        }
        list.forEach(b => grid.appendChild(createCard(b)));
      }

      render(books);

   
      searchInput.addEventListener("input", () => {
        const q = searchInput.value.trim().toLowerCase();
        if(!q){ render(books); return; }
        render(books.filter(b => b.name.toLowerCase().includes(q)));
      });

      async function openPdf(book){
     
        if(!auth.currentUser){
          const redirect = encodeURIComponent("bibliotheque.html");
          window.location.href = `login.html?redirect=${redirect}`;
          return;
        }
        dlgTitle.textContent = book.name;
        const raw = toRawUrl(book.url);

  
        if (currentBlobUrl){ URL.revokeObjectURL(currentBlobUrl); currentBlobUrl = null; }
        pdfFrame.src = "about:blank";

        try{
       
          const blobUrl = await loadPdfAsBlob(raw);
          currentBlobUrl = blobUrl;
  
          pdfFrame.src = blobUrl + "#toolbar=0&navpanes=0&scrollbar=0";
        }catch(err){
          alert("تعذّر عرض الملف مباشرة.\nقد يكون الملف خاصًا أو يمنع العرض من المصدر.\nالخطأ: " + err.message);
          return;
        }

        modal.classList.add("show");
        document.body.style.overflow = "hidden";
      }

      function closeModal(){
        modal.classList.remove("show");
        pdfFrame.src = "about:blank";
        if (currentBlobUrl) URL.revokeObjectURL(currentBlobUrl);
        currentBlobUrl = null;
        document.body.style.overflow = "";
      }

      closeBtn.addEventListener("click", closeModal);
      modal.addEventListener("click", (e) => { if(e.target === modal) closeModal(); });


      document.addEventListener("contextmenu", e => e.preventDefault());
      document.addEventListener("dragstart", e => e.preventDefault());
      document.addEventListener("keydown", (e) => {
        const key = e.key.toLowerCase();
        const ctrl = e.ctrlKey || e.metaKey;
        const shift = e.shiftKey;
        if (
          (ctrl && (key === 's' || key === 'p' || key === 'u')) ||
          (ctrl && shift && (key === 'i' || key === 'c' || key === 'j')) ||
          key === 'printscreen'
        ){
          e.preventDefault();
        }
      });
    }
  </script>
</body>
</html>
