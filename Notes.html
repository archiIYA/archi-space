<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NOTES — Mes Notes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --accent: 200 90% 55%;
      --accent-2: 200 90% 45%;
      --bg: 0 0% 100%;
      --fg: 222 47% 11%;
      --muted: 210 20% 92%;
      --card: 0 0% 100%;
      --ring: 200 90% 55%;
    }
    .dark:root{
      --bg: 222 47% 8%;
      --fg: 210 40% 98%;
      --muted: 222 34% 17%;
      --card: 222 36% 12%;
    }
    body{font-family:'Poppins',sans-serif;background-color:hsl(var(--bg));color:hsl(var(--fg));}
    .user-fingerprint-bg{ 
      background-image: radial-gradient( 1200px 600px at 100% -20%, hsl(var(--accent)/0.15), transparent 60%),
                        radial-gradient( 900px 500px at -10% 120%, hsl(var(--accent-2)/0.12), transparent 50%),
                        linear-gradient(135deg, hsl(var(--muted)), transparent 60%);
    }
    .glass{ backdrop-filter: blur(10px); background-color: hsl(var(--card)/0.65); }
    .note-card:hover{ transform: translateY(-3px); box-shadow: 0 10px 24px hsl(var(--accent)/0.18); }
    .chip{ border:1px solid hsl(var(--accent)/0.35); padding:.25rem .55rem; border-radius:999px; font-size:.8rem; }
  </style>
</head>
<body class="user-fingerprint-bg min-h-screen">
  <header class="sticky top-0 z-50">
    <div class="glass mx-4 mt-4 rounded-2xl px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div id="avatar" class="w-10 h-10 rounded-xl grid place-items-center font-extrabold text-white"
             style="background:linear-gradient(135deg,hsl(var(--accent)),hsl(var(--accent-2)));">U</div>
        <div>
          <h1 class="text-xl font-extrabold">Mes Notes</h1>
          <p id="welcome" class="text-sm opacity-75">Bienvenue 👋</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="themeBtn" class="px-3 py-2 rounded-xl hover:bg-white/10 transition" title="Mode sombre/clair">🌓</button>
        <button id="logoutBtn" class="px-3 py-2 rounded-xl hover:bg-white/10 transition" title="Déconnexion">🚪</button>
      </div>
    </div>
  </header>

  <main class="p-4 space-y-4">
    <div class="glass rounded-2xl p-4">
      <div class="flex flex-col md:flex-row gap-3">
        <input id="quickTitle" class="flex-1 rounded-xl px-3 py-2 bg-white/60 dark:bg-white/5" placeholder="Titre de la note"/>
        <input id="quickTags" class="md:w-64 rounded-xl px-3 py-2 bg-white/60 dark:bg-white/5" placeholder="Mots-clés séparés par virgule"/>
        <input id="quickReminder" type="datetime-local" class="md:w-64 rounded-xl px-3 py-2 bg-white/60 dark:bg-white/5" placeholder="Rappel"/>
        <button id="quickAdd" class="px-4 py-2 rounded-xl text-white font-bold"
          style="background:linear-gradient(135deg,hsl(var(--accent)),hsl(var(--accent-2)))">➕ Ajouter</button>
      </div>
    </div>

    <div id="notesGrid" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4"></div>
  </main>

  <!-- Rappel/Notification -->
  <div id="reminderPopup" class="hidden fixed bottom-5 right-5 bg-white dark:bg-gray-800 shadow-xl p-4 rounded-xl">
    <p id="reminderText" class="font-bold"></p>
    <button onclick="this.parentElement.classList.add('hidden')" class="mt-2 px-3 py-1 bg-red-500 text-white rounded-lg">Fermer</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, serverTimestamp, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain: "archi-space-72624.firebaseapp.com",
      projectId: "archi-space-72624",
      storageBucket: "archi-space-72624.firebasestorage.app",
      messagingSenderId: "407015246505",
      appId: "1:407015246505:web:c914a78566b882b80df7b8",
      measurementId: "G-RZV7LSDQBD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const welcome = document.getElementById('welcome');
    const avatar = document.getElementById('avatar');
    const notesGrid = document.getElementById('notesGrid');
    const quickTitle = document.getElementById('quickTitle');
    const quickTags = document.getElementById('quickTags');
    const quickReminder = document.getElementById('quickReminder');
    const quickAdd = document.getElementById('quickAdd');
    const themeBtn = document.getElementById('themeBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const reminderPopup = document.getElementById('reminderPopup');

    let UID = null;
    let cache = [];

    quickAdd.onclick = async ()=>{
      const title = quickTitle.value.trim();
      const tags = quickTags.value.split(',').map(s=>s.trim()).filter(Boolean);
      const reminderAt = quickReminder.value ? new Date(quickReminder.value) : null;
      if(!title) return;
      try{
        const ref = await addDoc(collection(db, `users/${UID}/notes`), { 
          title, 
          tags, 
          reminderAt: reminderAt ? reminderAt : null,
          createdAt: serverTimestamp(), 
          updatedAt: serverTimestamp() 
        });
        cache.unshift({ id: ref.id, title, tags, reminderAt, createdAt:new Date(), updatedAt:new Date() });
        render();
      }catch(err){ console.error(err); }
    }

    function noteCard(n){
      let reminderInfo = n.reminderAt ? `<p class=\"text-xs text-blue-600 dark:text-blue-400\">Rappel prévu: ${new Date(n.reminderAt).toLocaleString()}</p>` : '';
      return `<article class=\"note-card glass rounded-2xl p-4\" data-id=\"${n.id}\">
                <h3 class=\"font-bold\">${n.title}</h3>
                <p class=\"text-sm opacity-70\">Créée: ${n.createdAt.toLocaleString()}</p>
                ${reminderInfo}
              </article>`;
    }

    function render(){
      notesGrid.innerHTML = cache.map(noteCard).join('');
    }

    function setTheme(mode){
      if(mode==='dark'){ document.documentElement.classList.add('dark'); localStorage.setItem('theme','dark'); }
      else { document.documentElement.classList.remove('dark'); localStorage.setItem('theme','light'); }
    }
    setTheme(localStorage.getItem('theme')|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
    themeBtn.onclick = ()=> setTheme(document.documentElement.classList.contains('dark')?'light':'dark');

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ welcome.textContent = 'Veuillez vous connecter.'; return; }
      UID = user.uid;
      const name = user.displayName || user.email;
      welcome.textContent = `Bienvenue ${name}!`;
      avatar.textContent = name?.[0]?.toUpperCase()||'U';
      try{
        const snap = await getDocs(collection(db, `users/${UID}/notes`));
        cache = snap.docs.map(d=> ({ id: d.id, ...d.data(), createdAt:new Date() }));
        render();
        scheduleReminders();
      }catch(err){ console.error(err); }
    });

    logoutBtn.onclick = ()=> signOut(auth);

    function scheduleReminders(){
      cache.forEach(note=>{
        if(note.reminderAt){
          const when = new Date(note.reminderAt).getTime() - Date.now();
          if(when > 0){
            setTimeout(()=>{
              reminderPopup.classList.remove('hidden');
              document.getElementById('reminderText').textContent = `Rappel: ${note.title}`;
            }, when);
          }
        }
      });
    }
  </script>
</body>
</html>
