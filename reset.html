<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Réinitialiser le mot de passe | Trendy Plaza</title>
  <meta name="description" content="Réinitialisation du mot de passe pour Trendy Plaza ">

  <link rel="icon" href="logotrendy.svg" type="image/svg+xml">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet" />
  
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background:
        radial-gradient(circle at 20% 10%, rgba(225,29,46,.18), transparent 50%),
        linear-gradient(135deg, #eef2f7, #ffffff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      background: #ffffff;
      padding: 42px 32px;
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: fadeIn 0.9s ease;
    }

    .logo {
      display: block;
      margin: 0 auto 22px;
      width: 110px;
      height: auto;
      animation: floatLogo 3s ease-in-out infinite;
      filter:
        drop-shadow(0 10px 18px rgba(0,0,0,.25))
        drop-shadow(0 0 18px rgba(225,29,46,.25));
    }

    @keyframes floatLogo {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    h2 {
      color: #111;
      margin-bottom: 8px;
      font-weight: 700;
    }

    p {
      color: #555;
      font-size: 15px;
      margin-bottom: 26px;
      line-height: 1.6;
    }

    input[type="email"] {
      width: 100%;
      padding: 14px 15px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 12px;
      margin-bottom: 22px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #e11d2e;
      outline: none;
      box-shadow: 0 0 10px rgba(225,29,46,.35);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #e11d2e, #ff2d2d);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease;
      box-shadow: 0 12px 30px rgba(225,29,46,.35);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px rgba(225,29,46,.45);
    }

    #message {
      margin-top: 18px;
      font-weight: 600;
      font-size: 14px;
    }

    .loader {
      display: none;
      width: 42px;
      height: 42px;
      border: 4px solid #ddd;
      border-top: 4px solid #e11d2e;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 22px auto 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(30px);}
      to {opacity: 1; transform: translateY(0);}
    }

    footer {
      margin-top: 26px;
      font-size: 13px;
      color: #aaa;
    }
  </style>
</head>

<body>

  <div class="container">
    <img src="logotrendy.svg" alt="Trendy Plaza Logo" class="logo" />

    <h2>Réinitialisation du mot de passe</h2>
    <p>Entrez votre adresse e-mail pour recevoir un lien de réinitialisation.</p>
    
    <input type="email" id="email" placeholder="Votre adresse email" required />
    <button onclick="resetPassword()">Envoyer le lien</button>

    <div id="message"></div>
    <div class="loader" id="loader"></div>

    <footer>© 2025 Trendy Plaza </footer>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain: "archi-space-72624.firebaseapp.com",
      projectId: "archi-space-72624",
      storageBucket: "archi-space-72624.appspot.com",
      messagingSenderId: "407015246505",
      appId: "1:407015246505:web:1b3b54b87ca3f9a10df7b8",
      measurementId: "G-3JF6KDRNBP"
    };
    firebase.initializeApp(firebaseConfig);

    function resetPassword() {
      const email = document.getElementById("email").value.trim();
      const messageDiv = document.getElementById("message");
      const loader = document.getElementById("loader");

      messageDiv.textContent = "";
      loader.style.display = "block";

      firebase.auth().sendPasswordResetEmail(email)
        .then(() => {
          loader.style.display = "none";
          messageDiv.style.color = "green";
          messageDiv.textContent = "📩 Email envoyé avec succès ! Redirection…";
          setTimeout(() => {
            window.location.href = "login.html";
          }, 3000);
        })
        .catch((error) => {
          loader.style.display = "none";
          messageDiv.style.color = "red";
          messageDiv.textContent = "❌ Erreur : " + error.message;
        });
    }
  </script>
</body>
</html>
