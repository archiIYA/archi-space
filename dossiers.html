<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dossiers | ArchiSpace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
      font-family:"Poppins",sans-serif;
    }

    body{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f5f5f5;
      color:#111;
      overflow:hidden;
    }

    .container{
      text-align:center;
      background:#fff;
      padding:50px 40px;
      border-radius:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.15);
      animation:fadeUp 1.2s ease forwards;
      max-width:520px;
      width:90%;
      position:relative;
    }

    .icon{
      font-size:4rem;
      animation:float 3s ease-in-out infinite;
    }

    h1{
      margin:20px 0 10px;
      font-size:2rem;
      font-weight:700;
    }

    p{
      font-size:1rem;
      line-height:1.7;
      color:#555;
    }

    .loader{
      margin:30px auto 0;
      width:70px;
      height:6px;
      background:#eee;
      border-radius:10px;
      overflow:hidden;
      position:relative;
    }

    .loader::before{
      content:"";
      position:absolute;
      left:-40%;
      width:40%;
      height:100%;
      background:#000;
      animation:loading 1.4s infinite ease-in-out;
      border-radius:10px;
    }

    /* Animations */
    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes float{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-12px); }
    }

    @keyframes loading{
      0%{ left:-40%; }
      100%{ left:100%; }
    }

    /* Dark mode auto (if body has dark-mode) */
    body.dark-mode{
      background:#121212;
      color:#e0e0e0;
    }

    body.dark-mode .container{
      background:#1a1a1a;
      box-shadow:0 20px 60px rgba(0,0,0,.5);
    }

    body.dark-mode p{
      color:#aaa;
    }

    body.dark-mode .loader{
      background:#333;
    }

    body.dark-mode .loader::before{
      background:#e0e0e0;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="icon">🚧</div>
    <h1>Page en cours de développement</h1>
    <p>
      Cette page est actuellement en préparation.<br>
      Le contenu sera publié prochainement dans une version complète et organisée.
      <br><br>
      Merci pour votre patience et votre confiance.
    </p>

    <div class="loader"></div>
  </div>

</body>
</html>
