<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte - Archi.Space</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Rubik', sans-serif;
      background: linear-gradient(135deg, #2c3e50, #3498db);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
      width: 350px;
      text-align: center;
    }

    h2 {
      margin-bottom: 1rem;
      color: #2c3e50;
    }

    input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.6rem 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      transition: border 0.3s;
    }

    input:focus {
      border: 1px solid #3498db;
    }

    button {
      width: 100%;
      padding: 0.8rem;
      margin-top: 1rem;
      border: none;
      border-radius: 10px;
      background: #3498db;
      color: #fff;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
    }

    button:hover {
      background: #2980b9;
    }

    .error, .success {
      margin-top: 1rem;
      font-size: 14px;
      padding: 0.6rem;
      border-radius: 8px;
      display: none;
    }

    .error {
      background: #ffe5e5;
      color: #e74c3c;
    }

    .success {
      background: #e6ffed;
      color: #27ae60;
    }

    p {
      margin-top: 1rem;
      font-size: 14px;
    }

    a {
      color: #3498db;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>Créer un compte</h2>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Mot de passe" required>
    <button onclick="signup()">S’inscrire</button>
    <div class="error" id="errorBox"></div>
    <div class="success" id="successBox"></div>
    <p>Vous avez déjà un compte ? <a href="login.html">Se connecter</a></p>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js"></script>

  <script>
    // ✅ Firebase config (من مشروعك)
    const firebaseConfig = {
      apiKey: "AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain: "archi-space-72624.firebaseapp.com",
      projectId: "archi-space-72624",
      storageBucket: "archi-space-72624.firebasestorage.app",
      messagingSenderId: "407015246505",
      appId: "1:407015246505:web:c914a78566b882b80df7b8",
      measurementId: "G-RZV7LSDQBD"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.getAuth(app);

    async function signup() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const errorBox = document.getElementById("errorBox");
      const successBox = document.getElementById("successBox");

      errorBox.style.display = "none";
      successBox.style.display = "none";

      try {
        await firebase.createUserWithEmailAndPassword(auth, email, password);
        successBox.style.display = "block";
        successBox.innerText = "✅ Compte créé avec succès ! Redirection...";
        setTimeout(() => {
          window.location.href = "lecteur.html"; // ✅ بعد التسجيل يوجه لصفحة الدروس
        }, 2000);
      } catch (error) {
        errorBox.style.display = "block";
        if (error.code === "auth/email-already-in-use") {
          errorBox.innerText = "⚠️ Cet email est déjà utilisé. Essayez de vous connecter.";
        } else if (error.code === "auth/weak-password") {
          errorBox.innerText = "⚠️ Mot de passe trop faible (minimum 6 caractères).";
        } else if (error.code === "auth/invalid-email") {
          errorBox.innerText = "⚠️ Email invalide.";
        } else {
          errorBox.innerText = "⚠️ Erreur: " + error.message;
        }
      }
    }
  </script>
</body>
</html>
