<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inscription</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Global Styles & Dark Mode */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      height: 100%;
      font-family: 'Poppins', sans-serif;
      background: #f4f6fb;
      color: #333;
      transition: background-color 0.3s ease, color 0.3s ease;
      direction: ltr;
    }
    body.dark-mode {
      background: #1a1a1a;
      color: #e0e0e0;
    }

    /* Main Container */
    .container {
      display: flex;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Left Side (Image & Login) */
    .left-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f1f3f8;
      padding: 40px;
      transition: background-color 0.3s ease;
    }
    body.dark-mode .left-side {
      background: #2a2a2a;
    }
    .left-side img {
      max-width: 80%;
      height: auto;
      margin-bottom: 30px;
    }
    .left-side p {
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 1.1em;
      color: #555;
      transition: color 0.3s ease;
    }
    body.dark-mode .left-side p {
      color: #bbb;
    }
    .left-side button {
      padding: 12px 25px;
      border: 1px solid #333;
      background: transparent;
      cursor: pointer;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1em;
      transition: all 0.3s ease;
    }
    body.dark-mode .left-side button {
      border-color: #e0e0e0;
      color: #e0e0e0;
    }
    .left-side button:hover {
      background: #333;
      color: white;
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    body.dark-mode .left-side button:hover {
      background: #e0e0e0;
      color: #1a1a1a;
    }

    /* Right Side (Form) */
    .right-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      background: white;
      padding: 150px 40px 30px 40px;
      transition: background-color 0.3s ease;
      position: relative;
    }
    body.dark-mode .right-side {
      background: #121212;
    }
    .top-banner {
      background: #0d013d;
      width: calc(100% + 80px);
      height: 120px;
      position: absolute;
      top: 0;
      left: -40px;
      right: -40px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      border-radius: 0 0 15px 15px;
    }
    .top-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      max-width: none;
      max-height: none;
    }
    h2 {
      margin-top: 20px;
      margin-bottom: 25px;
      font-size: 2em;
      color: #0d013d;
      transition: color 0.3s ease;
    }
    body.dark-mode h2 {
      color: #e0e0e0;
    }
    form {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .input-group {
      display: flex;
      gap: 15px;
    }
    .input-group input {
      flex: 1;
    }
    .input-wrapper {
      position: relative;
      width: 100%;
    }
    input, select {
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 5px;
      background: #fdfdfd;
      color: #333;
      transition: border-color 0.3s ease, background-color 0.3s ease;
      width: 100%;
    }
    body.dark-mode input, body.dark-mode select {
      background: #2a2a2a;
      color: #e0e0e0;
      border-color: #444;
    }
    input::placeholder, select option {
      color: #888;
    }
    body.dark-mode input::placeholder, body.dark-mode select option {
      color: #aaa;
    }
    input:focus, select:focus {
      border-color: #0d013d;
      outline: none;
      box-shadow: 0 0 0 2px rgba(13, 1, 61, 0.2);
    }
    body.dark-mode input:focus, body.dark-mode select:focus {
      border-color: #e0e0e0;
      box-shadow: 0 0 0 2px rgba(224, 224, 224, 0.2);
    }
    input.error {
      border: 2px solid #dc3545;
    }
    .password-toggle {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: #888;
      transition: color 0.2s ease;
    }
    .password-toggle:hover {
      color: #333;
    }
    body.dark-mode .password-toggle {
      color: #aaa;
    }
    body.dark-mode .password-toggle:hover {
      color: #e0e0e0;
    }

    /* Buttons */
    button[type="submit"] {
      background: #0d013d;
      color: white;
      padding: 12px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s ease, transform 0.2s ease;
    }
    button[type="submit"]:hover {
      background: #060429;
      transform: translateY(-2px);
    }
    .or {
      text-align: center;
      color: #888;
      position: relative;
      margin: 10px 0;
    }
    .or::before, .or::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: #ccc;
    }
    body.dark-mode .or::before, body.dark-mode .or::after {
      background: #444;
    }
    .or::before {
      left: 0;
    }
    .or::after {
      right: 0;
    }
    .google-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      border: 1px solid #ddd;
      background: white;
      color: #555;
      padding: 10px;
      cursor: pointer;
      border-radius: 5px;
      font-weight: 600;
      transition: all 0.3s ease;
    }
    body.dark-mode .google-btn {
      background: #2a2a2a;
      color: #e0e0e0;
      border-color: #444;
    }
    .google-btn:hover {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      transform: translateY(-2px);
    }
    body.dark-mode .google-btn:hover {
      box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
    }
    .google-btn img {
      width: 20px;
      height: 20px;
    }

    /* Messages */
    #error-message {
      color: #dc3545;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
    }
    #success-message {
      color: #28a745;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* Dark Mode Toggle */
    .dark-mode-toggle {
      position: absolute;
      top: 20px;
      right: 20px;
      background: transparent;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: #555;
      z-index: 10;
      transition: color 0.3s ease, transform 0.2s ease;
    }
    .dark-mode-toggle:hover {
      transform: scale(1.1);
    }
    body.dark-mode .dark-mode-toggle {
      color: #e0e0e0;
    }

    /* Responsive Design */
    @media (max-width: 768px) {
      .container {
        flex-direction: column;
      }
      .left-side {
        display: none;
      }
      .right-side {
        padding: 130px 20px 20px 20px;
      }
      .top-banner {
        width: calc(100% + 40px);
        height: 100px;
        left: -20px;
        right: -20px;
      }
      .top-banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      h2 {
        margin-top: 10px;
      }
      .dark-mode-toggle {
        top: 10px;
        right: 10px;
      }
      .input-group {
        flex-direction: column;
        gap: 15px;
      }
    }
    /* تحسينات إضافية للشاشات الكبيرة جدًا */
    @media (min-width: 1200px) {
      .top-banner {
        height: 140px;
      }
      .top-banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    }
    @media (max-width: 480px) {
      .top-banner {
        height: 90px;
      }
      .top-banner img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    }
  </style>
</head>
<body>
  <button class="dark-mode-toggle" onclick="toggleDarkMode()">☀️</button>
  <div class="container">
    <div class="left-side">
      <img src="Design sans titre.png" alt="Illustration" />
      <p>Vous avez déjà un compte ?</p>
      <button onclick="window.location.href='login.html'">Se Connecter</button>
    </div>
    
    <div class="right-side">
      <div class="top-banner">
        <img src="00.png" alt="Logo">
      </div>
      <h2>Inscription</h2>
      <form id="signup-form" novalidate>
        <p id="error-message"></p>
        <p id="success-message"></p>
        
        <input type="email" id="email" placeholder="Adresse e-mail *" required />
        <div class="input-wrapper">
          <input type="password" id="password" placeholder="Mot de passe *" required />
          <span class="password-toggle" onclick="togglePasswordVisibility('password')">
            <i class="far fa-eye"></i>
          </span>
        </div>
        <div class="input-wrapper">
          <input type="password" id="confirm-password" placeholder="Confirmer le mot de passe *" required />
          <span class="password-toggle" onclick="togglePasswordVisibility('confirm-password')">
            <i class="far fa-eye"></i>
          </span>
        </div>
        
        <button type="submit">S'inscrire</button>
        <div class="or">Ou</div>
        <button type="button" class="google-btn" onclick="signInWithGoogle()">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:20px; height:20px;" alt="Google logo">
          S'inscrire avec Google
        </button>
      </form>
    </div>
  </div>

  
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain: "archi-space-72624.firebaseapp.com",
      projectId: "archi-space-72624",
      storageBucket: "archi-space-72624.appspot.com",
      messagingSenderId: "407015246505",
      appId: "1:407015246505:web:c914a78566b882b80df7b8",
      measurementId: "G-RZV7LSDQBD"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const form = document.getElementById("signup-form");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirm-password");
    const errorBox = document.getElementById("error-message");
    const successBox = document.getElementById("success-message");

    function clearMessages() {
      errorBox.textContent = "";
      successBox.textContent = "";
      emailInput.classList.remove('error');
      passwordInput.classList.remove('error');
      confirmPasswordInput.classList.remove('error');
    }

    function markError(elementId, message) {
      document.getElementById(elementId).classList.add('error');
      errorBox.textContent = message;
    }
    
    // Modification majeure ici
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      clearMessages();

      const email = emailInput.value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      let hasError = false;
      if (!email) {
        hasError = true;
        markError("email", "⚠️ Veuillez entrer votre adresse e-mail.");
      } else if (!isValidEmail(email)) {
        hasError = true;
        markError("email", "⚠️ Veuillez entrer une adresse e-mail valide.");
      }
      if (!password) {
        hasError = true;
        markError("password", "⚠️ Veuillez choisir un mot de passe.");
      } else if (password.length < 6) {
        hasError = true;
        markError("password", "⚠️ Le mot de passe doit contenir au moins 6 caractères.");
      }
      if (password !== confirmPassword) {
        hasError = true;
        markError("confirm-password", "⚠️ Les mots de passe ne correspondent pas.");
      }
      if (hasError) return;

      try {
        // Step 1: Create the user in Firebase Authentication
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Step 2: Attempt to save user data to Firestore
        try {
          await db.collection("users").doc(user.uid).set({
            email,
            createdAt: new Date()
          });
        } catch (dbError) {
          // Log the Firestore error but don't prevent the success message and redirection
          console.error("Erreur Firestore, mais l'utilisateur a été créé :", dbError);
        }

        // Step 3: All steps are successful, proceed with redirection
        const userData = { email, uid: user.uid };
        localStorage.setItem("userProfile", JSON.stringify(userData));
        successBox.textContent = "🎉 Inscription réussie ! Redirection en cours...";
        setTimeout(() => {
          window.location.href = "lecteur.html";
        }, 1500);

      } catch (authError) {
        // Catch only authentication errors from Firebase
        handleFirebaseError(authError);
      }
    });

    function handleFirebaseError(err) {
      let errorMessage = "⚠️ Erreur lors de l'inscription. Veuillez réessayer.";
      if (err.code === "auth/email-already-in-use") {
        errorMessage = "⚠️ Cette adresse e-mail est déjà utilisée.";
        markError("email", errorMessage);
      } else if (err.code === "auth/invalid-email") {
        errorMessage = "⚠️ L'adresse e-mail n'est pas valide.";
        markError("email", errorMessage);
      } else if (err.code === "auth/weak-password") {
        errorMessage = "⚠️ Le mot de passe est trop faible. Il doit contenir au moins 6 caractères.";
        markError("password", errorMessage);
      } else {
        errorBox.textContent = errorMessage;
      }
    }

    async function signInWithGoogle() {
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        const result = await auth.signInWithPopup(provider);
        const user = result.user;
        const userRef = db.collection("users").doc(user.uid);
        const doc = await userRef.get();
        if (!doc.exists) {
          await userRef.set({
            email: user.email,
            createdAt: new Date()
          });
        }
        const userData = (await userRef.get()).data();
        localStorage.setItem("userProfile", JSON.stringify({...userData, uid: user.uid}));
        successBox.textContent = "🎉 Connexion Google réussie ! Redirection en cours...";
        setTimeout(() => {
          window.location.href = "profil.html";
        }, 1500);
      } catch (err) {
        errorBox.textContent = "⚠️ Erreur Google Sign-In : " + err.message;
      }
    }

    function isValidEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(String(email).toLowerCase());
    }

    // Dark Mode Toggle Logic
    window.toggleDarkMode = function() {
      document.body.classList.toggle('dark-mode');
      const isDarkMode = document.body.classList.contains('dark-mode');
      localStorage.setItem('darkMode', isDarkMode);
      document.querySelector('.dark-mode-toggle').innerHTML = isDarkMode ? "🌙" : "☀️";
    };

    // Toggle Password Visibility
    window.togglePasswordVisibility = function(fieldId) {
      const passwordField = document.getElementById(fieldId);
      const icon = passwordField.nextElementSibling.querySelector('i');
      if (passwordField.type === "password") {
        passwordField.type = "text";
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        passwordField.type = "password";
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    };

    // Apply saved mode on page load
    if (localStorage.getItem('darkMode') === 'true') {
      document.body.classList.add('dark-mode');
      document.querySelector('.dark-mode-toggle').innerHTML = "🌙";
    } else {
      document.querySelector('.dark-mode-toggle').innerHTML = "☀️";
    }
  </script>
</body>
</html>
