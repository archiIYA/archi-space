<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer un compte - archi.space</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .signup-box {
      background: #fff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 380px;
      text-align: center;
    }
    .signup-box h2 {
      margin-bottom: 20px;
    }
    input, select {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      width: 100%;
      padding: 12px;
      margin-top: 15px;
      background: #2a9d8f;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background: #21867a;
    }
    .message {
      margin-top: 12px;
      font-size: 0.9em;
    }
    .success {
      color: green;
    }
    .error {
      color: red;
    }
  </style>
</head>
<body>
  <div class="signup-box">
    <h2>Créer un compte</h2>
    <input type="text" id="nom" placeholder="Nom" required>
    <input type="text" id="prenom" placeholder="Prénom" required>
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Mot de passe" required>
    <input type="password" id="confirmPassword" placeholder="Confirmer le mot de passe" required>
    <select id="universite" required>
      <option value="">-- Choisir votre université --</option>
      <option value="Université d'Alger">Université d'Alger</option>
      <option value="Université de Constantine">Université de Constantine</option>
      <option value="Université d'Oran">Université d'Oran</option>
      <option value="Autre">Autre</option>
    </select>
    <button onclick="register()">S'inscrire</button>
    <p class="message" id="message"></p>
  </div>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { v4 as uuidv4 } from "https://jspm.dev/uuid";

    // ✅ Config Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain: "archi-space-72624.firebaseapp.com",
      projectId: "archi-space-72624",
      storageBucket: "archi-space-72624.firebasestorage.app",
      messagingSenderId: "407015246505",
      appId: "1:407015246505:web:c914a78566b882b80df7b8",
      measurementId: "G-RZV7LSDQBD"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // ✅ Fonction d'inscription
    async function register() {
      const nom = document.getElementById("nom").value.trim();
      const prenom = document.getElementById("prenom").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const universite = document.getElementById("universite").value;
      const message = document.getElementById("message");

      message.textContent = "";
      message.className = "message";

      // Vérif mots de passe
      if (password !== confirmPassword) {
        message.textContent = "❌ Les mots de passe ne correspondent pas";
        message.classList.add("error");
        return;
      }

      try {
        // Création utilisateur Firebase
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // Générer un numéro d'inscription unique
        const registrationId = uuidv4();

        // Sauvegarder les infos dans Firestore
        await setDoc(doc(db, "users", user.uid), {
          nom,
          prenom,
          email,
          universite,
          registrationId,
          createdAt: new Date()
        });

        // Succès
        message.textContent = `✅ Inscription réussie ! Votre N°: ${registrationId}`;
        message.classList.add("success");

        // Redirection après 2 secondes
        setTimeout(() => {
          window.location.href = "accueil.html";
        }, 2000);

      } catch (error) {
        message.textContent = "❌ Erreur : " + error.message;
        message.classList.add("error");
      }
    }

    window.register = register;
  </script>
</body>
</html>
