<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🏊 Projet — Piscine 8 Mai 1945 (Premium)</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#0f172a; --card:#0b1220; --muted:#94a3b8; --text:#e5e7eb;
      --accent:#22d3ee; --accent-2:#38bdf8; --ring:#22d3ee55; --border:#1f2937;
    }
    :root.light{
      --bg:#f8fafc; --card:#ffffff; --muted:#64748b; --text:#0f172a;
      --accent:#0891b2; --accent-2:#0ea5e9; --ring:#0ea5e955; --border:#e2e8f0;
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; background:linear-gradient(135deg, var(--bg), var(--card) 60%);
      color:var(--text); font-family:'Rubik', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
      user-select:none; -webkit-user-select:none;
    }
    .container{max-width:1180px; margin:0 auto; padding:18px}
    .topbar{
      display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
      background:color-mix(in srgb, var(--card) 92%, transparent);
      border:1px solid var(--border); border-radius:16px; padding:10px 14px;
      backdrop-filter: blur(8px);
    }
    .brand{display:flex; align-items:center; gap:10px; font-weight:800}
    .logo{
      width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-size:20px;
      background: radial-gradient(120% 120% at 0% 0%, var(--accent) 0%, transparent 60%),
                  radial-gradient(120% 120% at 100% 100%, var(--accent-2) 0%, transparent 60%);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent-2) 35%, transparent),
                  0 10px 20px color-mix(in srgb, var(--accent) 30%), inset 0 0 0 0 transparent;
    }
    .controls{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
    .btn{
      appearance:none; border:1px solid var(--border); background:var(--card); color:var(--text);
      border-radius:12px; padding:8px 12px; cursor:pointer; font-weight:600; display:inline-flex; align-items:center; gap:8px;
      transition:transform .15s ease;
    }
    .btn:active{transform:translateY(1px)}
    .btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent-2)); color:#001018; border:none}
    .grid{display:grid; gap:14px; margin-top:16px}
    .card{
      background:linear-gradient(180deg, var(--card), color-mix(in srgb, var(--card) 92%, transparent));
      border:1px solid var(--border); border-radius:16px; padding:14px;
    }
    .title{font-weight:800; font-size:20px; margin-bottom:6px}
    .meta{color:var(--muted); font-size:13px}
    .viewer-wrap{position:relative; height:min(86vh, 880px); border-radius:14px; overflow:hidden; margin-top:10px; background:var(--bg)}
    iframe.viewer{position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--bg)}
    .wm{
      position:absolute; inset:0; display:grid; place-items:center; pointer-events:none;
      opacity:.06; font-weight:800; font-size:56px; user-select:none;
    }
    .shield{position:absolute; inset:0; pointer-events:none;
      background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 10px, rgba(0,0,0,.02) 10px 20px)}
    .blur-guard{position:absolute; inset:0; background:rgba(0,0,0,.6); color:#fff; display:none; align-items:center; justify-content:center; z-index:2; text-align:center; padding:20px}
    .viewer-wrap.blurred .blur-guard{display:flex}
    .toast{
      position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
      background:rgba(15,23,42,.95); color:white; padding:10px 14px; border-radius:12px; border:1px solid var(--border); z-index:80; font-size:14px
    }

    @media print { body{ display:none !important; } }
  </style>
</head>
<body>

  <div class="container">
    <div class="topbar">
      <div class="brand">
        <div class="logo">🏊</div>
        <div>Piscine 8 Mai 1945 — Premium</div>
      </div>
      <div class="controls">
        <button id="backBtn" class="btn">⬅️ رجوع</button>
        <a id="homeBtn" class="btn" href="projets.html">🏠 الرئيسية</a>
        <button id="themeToggle" class="btn" title="Basculer thème">🌗 Mode</button>
        <button id="impBtn" class="btn">🖨️ ImpEc</button>
        <button id="logoutBtn" class="btn">🚪 Déconnexion</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="title">RÉHABILITATION DE LA PISCINE OLYMPIQUE DU 8 MAI 1945 À SÉTIF</div>
        <div class="meta">Vers un équipement sportif intelligent et durable — PDF protégé</div>

        <div id="viewerWrap" class="viewer-wrap" oncontextmenu="return false;">
          <div class="shield"></div>
          <div id="wm" class="wm">ARCHI.SPACE</div>
          <div class="blur-guard"><div>🛡️ تم تعطيل لقطة/تسجيل الشاشة هنا. عد إلى التبويب للمتابعة.</div></div>
          <iframe id="viewer" class="viewer"
                  sandbox="allow-scripts allow-same-origin"
                  referrerpolicy="no-referrer"
                  allow="clipboard-read; clipboard-write"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";


    const firebaseConfig = {
      apiKey: "AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain: "archi-space-72624.firebaseapp.com",
      projectId: "archi-space-72624",
      storageBucket: "archi-space-72624.firebasestorage.app",
      messagingSenderId: "407015246505",
      appId: "1:407015246505:web:c914a78566b882b80df7b8",
      measurementId: "G-RZV7LSDQBD"
    };
    const appFB = initializeApp(firebaseConfig);
    const auth = getAuth(appFB);
    const db = getFirestore(appFB);


    const viewer = document.getElementById("viewer");
    const viewerWrap = document.getElementById("viewerWrap");
    const wm = document.getElementById("wm");
    const logoutBtn = document.getElementById("logoutBtn");
    const impBtn = document.getElementById("impBtn");
    const backBtn = document.getElementById("backBtn");
    const themeToggle = document.getElementById("themeToggle");
    const root = document.documentElement;


    const THEME_KEY = "archispace-theme";
    const setTheme = (mode) => {
      if (mode === "light") root.classList.add("light"); else root.classList.remove("light");
      localStorage.setItem(THEME_KEY, mode);
    };
    setTheme(localStorage.getItem(THEME_KEY) || "dark");
    themeToggle.addEventListener("click", ()=> setTheme(root.classList.contains("light") ? "dark" : "light"));


    backBtn.addEventListener("click", ()=>{
      if (history.length > 1) history.back();
      else window.location.href = "projets.html";
    });
    logoutBtn.addEventListener("click", async ()=>{ await signOut(auth); });


    const PROJECT_ID = "rehab-piscine-setif-8mai1945";
    const PROJECT_URL = "https://cdn.jsdelivr.net/gh/archiIYA/archi-space/Projet_Piscine_Olympique_Setif.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH";


    const toast = (msg, ms=1600)=>{
      const d = document.createElement("div");
      d.className = "toast"; d.textContent = msg; document.body.appendChild(d);
      setTimeout(()=> d.remove(), ms);
    };


    function codeRefByEmail(email, projectId){
      return doc(db, "projectAccessByEmail", email, "codes", projectId);
    }
    async function verifyCodeByEmail(email, projectId, inputCode){
      const snap = await getDoc(codeRefByEmail(email, projectId));
      if (!snap.exists()) return { ok:false, reason:"notfound" };
      const data = snap.data();
      const exp = data.expiresAt?.toDate?.() || new Date(0);
      if (new Date() > exp) return { ok:false, reason:"expired" };
      const ok = String(inputCode).trim() === String(data.code).trim();
      return { ok, reason: ok ? "checked" : "mismatch" };
    }


    async function demandCodeOrLeave(user){
     
      for (let tries=0; tries<3; tries++){
        const input = prompt("أدخل كود الوصول إلى هذا المشروع:");
        if(!input){ if(confirm("إلغاء؟")) return false; else continue; }
        const check = await verifyCodeByEmail(user.email, PROJECT_ID, input);
        if (check.ok) return true;
        if (check.reason === "expired"){
          alert("⏰ الكود منتهي الصلاحية. يرجى طلب كود جديد بعد الدفع.");
          return false;
        }
        toast("❌ كود غير صحيح.");
      }
      return false;
    }


    function openPdf(src){
      viewer.src = src;
      viewer.onload = ()=>{};
      viewer.onerror = ()=>{
        toast("تعذّر العرض داخل الصفحة — سيتم فتحه في تبويب جديد…");
        window.open(src, "_blank", "noopener,noreferrer");
      };
    }


    function guardShortcuts(){
      const blockCombos = (e)=>{
        const k = e.key;
        const key = (k || "").toLowerCase();
        const ctrl = e.ctrlKey || e.metaKey;
        const shift = e.shiftKey;
        const alt = e.altKey;

     
        const blocked =
          (ctrl && (['s','p','u','a','c','x','v','o'].includes(key))) ||   
          (ctrl && shift && (['i','c','j'].includes(key))) ||              
          (key === 'f12') ||                                               
          (k === 'PrintScreen');                                           

        if (blocked){
          e.preventDefault();
          e.stopPropagation();
          toast("🚫 تم تعطيل الاختصار.");

          if (k === 'PrintScreen'){
            navigator.clipboard && navigator.clipboard.writeText("Screenshot disabled.").catch(()=>{});
          }
          return false;
        }


        if (e.type === 'keypress' && ctrl && key === 'p'){
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      };

      ['keydown','keyup','keypress'].forEach(evt=>{
        document.addEventListener(evt, blockCombos, true);
        window.addEventListener(evt, blockCombos, true);
      });


      window.print = ()=>{ toast("🖨️ الطباعة/التصدير معطّلة."); return; };
      impBtn.addEventListener("click", ()=> toast("🖨️ الطباعة/التصدير معطّلة."));


      ['contextmenu','dragstart','copy','cut','paste'].forEach(evt=>{
        document.addEventListener(evt, (e)=>{ e.preventDefault(); e.stopPropagation(); }, true);
      });


      document.addEventListener("visibilitychange", ()=>{
        if (document.hidden) viewerWrap.classList.add("blurred");
        else viewerWrap.classList.remove("blurred");
      });
      window.addEventListener("blur", ()=> viewerWrap.classList.add("blurred"));
      window.addEventListener("focus", ()=> viewerWrap.classList.remove("blurred"));
    }


    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        const redirect = encodeURIComponent("rehab-piscine-setif-8mai1945.html");
        window.location.href = `login.html?redirect=${redirect}`;
        return;
      }


      wm.textContent = (user.email || "ARCHI.SPACE").toUpperCase();


      const ok = await demandCodeOrLeave(user);
      if (!ok){
        alert("تم إلغاء الوصول إلى المشروع.");
        window.location.href = "projets.html";
        return;
      }


      openPdf(PROJECT_URL);
    });


    guardShortcuts();
  </script>
</body>
</html>
