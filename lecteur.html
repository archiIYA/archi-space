<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="archi.space est une plateforme éducative d’architecture : cours, projets, livres.">
  <meta name="keywords" content="architecture, cours architecture, archi.space, PFE, projet étudiant, دروس معمارية, fac architecture">
  <meta name="author" content="archi.space">
  <title>archi.space - Accueil</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Poppins', sans-serif;
      display: flex;
      background: linear-gradient(145deg, #d0f0f4, #a8d0d8);
      color: #1d1d1d;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* زر إظهار القائمة على الأجهزة الصغيرة */
    .sidebar-toggle {
      display: none;
      position: fixed;
      top: 15px;
      left: 15px;
      background-color: #c08457;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      z-index: 110;
    }
    /* القائمة الجانبية على اليسار */
    .sidebar {
      width: 280px;
      background-color: #fff;
      height: 100vh;
      position: fixed;
      border-right: 1px solid #ddd;
      box-shadow: 5px 0 15px rgba(0, 0, 0, 0.05);
      z-index: 100;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: transform 0.3s ease;
    }
    .sidebar.hidden {
      transform: translateX(-100%);
    }
    .sidebar.show {
      transform: translateX(0);
    }
    .sidebar h2 {
      font-size: 1.6em;
      font-weight: 600;
      text-align: center;
      background: linear-gradient(to right, #c08457, #e0a16b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 20px;
    }
    /* روابط البطاقات داخل القائمة الجانبية */
    .sidebar a.card-link {
      background: #ffffff;
      padding: 15px 20px;
      border-radius: 15px;
      box-shadow: 4px 4px 12px rgba(0, 0, 0, 0.05);
      text-decoration: none;
      color: #c08457;
      font-weight: 600;
      transition: background 0.3s ease;
      cursor: pointer;
      display: block;
      text-align: center;
    }
    .sidebar a.card-link:hover {
      background: #f0e4d4;
      color: #a26535;
    }
    /* محتوى الوسط يحتوي على بطاقات السنوات */
    .content {
      margin-left: 280px;
      flex-grow: 1;
      padding: 40px 30px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      justify-items: center;
      align-content: start;
      animation: fadeIn 1s ease-in-out;
      min-height: 100vh;
    }
    /* بطاقات السنوات */
    .year-card {
      background: #ffffff;
      padding: 25px 20px;
      border-radius: 20px;
      box-shadow: 6px 6px 18px rgba(0, 0, 0, 0.05);
      cursor: pointer;
      width: 220px;
      text-align: center;
      color: #c08457;
      font-weight: 600;
      font-size: 1.3em;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      user-select: none;
    }
    .year-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.15);
    }
    /* زر خروج */
    .logout {
      background-color: #e76f51;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: background 0.3s;
      margin-bottom: 20px;
    }
    .logout:hover {
      background-color: #d6583f;
    }
    /* زر اظهر/اخفي القائمة */
    @media (max-width: 768px) {
      .sidebar-toggle {
        display: block;
      }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        height: 100vh;
        transform: translateX(-100%);
        width: 280px;
        box-shadow: 5px 0 15px rgba(0, 0, 0, 0.2);
      }
      .sidebar.show {
        transform: translateX(0);
      }
      .content {
        margin-left: 0;
        width: 100%;
        padding: 20px 15px;
        display: block; /* تغيير من grid للعرض العمودي على الهواتف */
      }
      .year-card {
        width: 100% !important;
        margin-bottom: 20px;
      }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()">☰</button>
  <div class="sidebar">
    <h2>🎓 archi.space</h2>
    <!-- بطاقات تحتوي على روابط للمحتوى -->
    <a href="https://t.me/+DJAWFkqTVvJkYWU8" target="_blank" rel="noopener" class="card-link">Demande de résumés</a>
    <a href="bibliotheque.html" class="card-link">Bibliothèque</a>
    <a href="dossiers.html" class="card-link">Dossiers de cours</a>

    <a href="specialite.html" class="card-link">Présentation de la spécialité</a>
    <button class="logout" onclick="logout()">Déconnexion</button>
  </div>
  <div class="content">
    <!-- بطاقات السنوات في الوسط -->
    <div class="year-card" onclick="location.href='sem1.html'">🧰 1ère année</div>
    <div class="year-card" onclick="location.href='sem2.html'">✏️ Semestre 2</div>
    <div class="year-card" onclick="location.href='sem3.html'">📐 2ème année</div>
    <div class="year-card" onclick="location.href='sem4.html'">🧪 Semestre 4</div>
    <div class="year-card" onclick="location.href='sem5.html'">🏗️ 3ème année</div>
    <div class="year-card" onclick="location.href='sem6.html'">🛰️ Semestre 6</div>
    <div class="year-card" onclick="location.href='sem7.html'">🏛️ 4ème année</div>
    <div class="year-card" onclick="location.href='sem8.html'">🗂️ Semestre 8</div>
    <div class="year-card" onclick="location.href='sem9.html'">🎓 5ème année</div>
    <div class="year-card" onclick="location.href='sem10.html'">🏆 Semestre 10</div>
  </div>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    const firebaseConfig = {
      apiKey: "AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain: "archi-space-72624.firebaseapp.com",
      projectId: "archi-space-72624",
      storageBucket: "archi-space-72624.appspot.com",
      messagingSenderId: "407015246505",
      appId: "1:407015246505:web:c914a78566b882b80df7b8",
      measurementId: "G-RZV7LSDQBD"
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "login.html";

    window.logout = function () {
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    };
    window.toggleSidebar = function() {
      const sidebar = document.querySelector('.sidebar');
      sidebar.classList.toggle('show');
    };
  </script>
</body>
</html>
