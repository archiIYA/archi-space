<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quiz Histoire de l’Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#fff; --text:#111; --muted:#666; --card:#fafafa; --side:#f4f4f4; --btn:#111; --btnText:#fff; --shadow:0 2px 6px rgba(0,0,0,.05);
      --hl:#ffe58f;
    }
    *{box-sizing:border-box}
    html,body{height:100%;}
    body{ margin:0; font-family:'Rubik',sans-serif; background:var(--bg); color:var(--text); display:flex; }
    aside{
      width:240px; background:var(--side); height:100vh; padding:20px;
      box-shadow:2px 0 5px rgba(0,0,0,.1); overflow-y:auto; position:fixed; left:0; top:0;
      transform:translateX(0); transition:transform .3s ease; z-index:998;
    }
    aside.hidden{ transform:translateX(-260px); }
    .back-button{ margin-bottom:12px; background:#ddd; border:none; padding:10px 15px; border-radius:6px; cursor:pointer; width:100%; font-weight:600; transition:background .3s;}
    .back-button:hover{ background:#ccc;}
    aside h2{ font-size:18px; margin:12px 0 16px;}
    aside a{ display:block; padding:10px; margin-bottom:8px; text-decoration:none; color:#333; border-radius:6px; transition:background .3s;}
    aside a:hover{ background:#ddd;}
    #toggleSidebar{
      position:fixed; inset:12px auto auto 12px; z-index:9999;
      background:var(--btn); color:var(--btnText); border:none; padding:10px 15px; font-size:18px; border-radius:8px;
      cursor:pointer; box-shadow:var(--shadow); transform:none !important; pointer-events:auto;
    }
    main{ flex-grow:1; padding:30px; margin-left:240px; transition:margin-left .3s ease; }
    aside.hidden ~ main{ margin-left:0; }
    .section-title{ font-size:26px; margin:18px 0 12px; color:#000;}
    .search-wrap{ position:sticky; top:0; background:var(--bg); padding:6px 0 16px; z-index:100; }
    .search-row{ display:flex; gap:10px; align-items:center; }
    .search-wrap input{ flex:1; padding:12px 14px; border:1px solid #e1e1e1; border-radius:10px; font-size:15px; }
    .module-title{ font-size:22px; margin:28px 0 12px; color:#000; border-bottom:2px solid #eee; padding-bottom:6px; }
    .quiz-list{ margin-top:24px; }
    .quiz-item{ background:var(--card); margin-bottom:16px; padding:16px 18px; border-radius:10px; box-shadow:var(--shadow); }
    .quiz-item-title{ font-size:16px; margin:0 0 10px; font-weight:600;}
    .quiz-item-link{ display:inline-block; padding:10px 16px; margin:4px 0; border-radius:7px; background:#222; color:#fff; text-decoration:none; font-size:15px; transition:background .2s;}
    .quiz-item-link:hover{ background:#444;}
    footer{ margin-top:50px; font-size:13px; color:#888; text-align:center; }
    .empty{ display:none; padding:10px; color:#999; }
  </style>
