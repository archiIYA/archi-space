  <style>
    :root {
      --primary: #7c5cff;
      --bg: #0f1224;

      --text: #ffffff;
      --muted: #b3b3d9;
      --success: #4caf50;
      --danger: #ff5252;
    }

    * {
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      margin: 0;
      background: radial-gradient(circle at top, #1b1f45, #0f1224);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 30px;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    header img {
      height: 45px;
    }

    header h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0;
    }

    .container {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: var(--card);
      backdrop-filter: blur(16px);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.35);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    select {
      background: #1b1f45;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 10px;
      font-size: 14px;
    }

    .question {
      font-size: 18px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .options {
      display: grid;
      gap: 12px;
    }

    .option {
      padding: 14px 16px;
      background: rgba(255,255,255,0.06);
      border-radius: 12px;
      cursor: pointer;
      transition: 0.3s;
      border: 1px solid transparent;
    }

    .option:hover {
      background: rgba(255,255,255,0.12);
    }

    .option.selected {
      border-color: var(--primary);
      background: rgba(124,92,255,0.25);
    }

    .option.correct {
      background: rgba(76,175,80,0.3);
      border-color: var(--success);
    }

    .option.wrong {
      background: rgba(255,82,82,0.25);
      border-color: var(--danger);
    }

    .actions {
      display: flex;
      justify-content: space-between;
      margin-top: 25px;
      gap: 10px;
    }

    button {
      background: linear-gradient(135deg, var(--primary), #9b7bff);
      border: none;
      color: white;
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s;
    }

    button.secondary {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
    }

    button:hover {
      transform: translateY(-2px);
    }

    .summary {
      margin-top: 20px;
      padding: 15px;
      background: rgba(255,255,255,0.06);
      border-left: 4px solid var(--primary);
      border-radius: 10px;
      color: var(--muted);
      font-size: 14px;
      display: none;
    }

    .score {
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      margin-top: 30px;
    }
  </style>
</head>

let currentVersion = "A";
let questions = ERM_VersionA;
let index = 0;
let answers = {};

const questionBox = document.getElementById("questionBox");
const optionsBox = document.getElementById("optionsBox");
const summaryBox = document.getElementById("summaryBox");
const counter = document.getElementById("counter");
const scoreBox = document.getElementById("scoreBox");

document.getElementById("versionSelect").onchange = e => {
  currentVersion = e.target.value;
  questions = currentVersion === "A" ? ERM_VersionA : ERM_VersionC;
  index = 0;
  answers = {};
  scoreBox.innerHTML = "";
  render();
};

function render() {
  const q = questions[index];
  counter.textContent = `Question ${index + 1} / ${questions.length}`;
  questionBox.innerHTML = q.text;
  optionsBox.innerHTML = "";
  summaryBox.style.display = "none";

  q.options.forEach((opt, i) => {
    const div = document.createElement("div");
    div.className = "option";
    div.textContent = opt;
    if (answers[q.id] === i) div.classList.add("selected");
    div.onclick = () => selectAnswer(i);
    optionsBox.appendChild(div);
  });
}

function selectAnswer(i) {
  const q = questions[index];
  answers[q.id] = i;

  [...optionsBox.children].forEach((el, idx) => {
    el.classList.remove("selected","correct","wrong");
    if (idx === i) el.classList.add("selected");
    if (idx === q.correctAnswer) el.classList.add("correct");
    if (idx === i && i !== q.correctAnswer) el.classList.add("wrong");
  });

  summaryBox.innerHTML = q.summaryLink;
  summaryBox.style.display = "block";
}

function nextQuestion() {
  if (index < questions.length - 1) {
    index++;
    render();
  } else {
    calculateScore();
  }
}

function prevQuestion() {
  if (index > 0) {
    index--;
    render();
  }
}

function calculateScore() {
  let score = 0;
  questions.forEach(q => {
    if (answers[q.id] === q.correctAnswer) {
      score += q.points;
    }
  });
  scoreBox.innerHTML = `Score final : ${score.toFixed(2)} / ${questions.length}`;
}

render();
</script>
