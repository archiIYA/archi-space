<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Divertissement | Trendy Plaza</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>
:root{
  --red:#e11d2e;
  --red2:#ff2d2d;
  --dark:#0b0f14;
  --glass:rgba(255,255,255,.8);
  --border:rgba(225,29,46,.2);
  --shadow-soft:0 10px 30px rgba(0,0,0,.08);
  --shadow-hover:0 18px 45px rgba(225,29,46,.18);
  --radius:20px;
}

*{margin:0;padding:0;box-sizing:border-box;font-family:"Poppins",sans-serif}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at 10% 0%, rgba(225,29,46,.1), transparent 40%),
    linear-gradient(180deg,#fff,#fff5f6 60%,#fff);
  color:var(--dark);
}

/* ---------- Layout ---------- */
.app{
  display:grid;
  grid-template-columns:280px 1fr;
  min-height:100vh;
}

.sidebar{
  background:var(--glass);
  backdrop-filter:blur(14px);
  border-right:1px solid var(--border);
  padding:18px;
  position:sticky;
  top:0;
  height:100vh;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  padding-bottom:16px;
  border-bottom:1px solid rgba(0,0,0,.06);
}
.brand img{
  width:48px;height:48px;
  border-radius:14px;
  background:#fff;
  padding:6px;
  border:1px solid var(--border);
}
.brand h1{font-size:1.05rem;font-weight:900}

/* ---------- Sidebar ---------- */
.side-actions{margin:18px 0;display:grid;gap:10px}

.btn{
  padding:12px;
  border-radius:14px;
  border:none;
  cursor:pointer;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  text-decoration:none;
  transition:.2s;
}
.btn.primary{
  background:linear-gradient(135deg,var(--red),var(--red2));
  color:#fff;
}
.btn.ghost{
  background:#fff;
  border:1px solid var(--border);
  color:var(--red);
}
.btn:hover{transform:translateY(-2px)}

.nav-title{
  font-size:.8rem;
  font-weight:700;
  opacity:.6;
  margin:10px 0;
}
.nav a{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  border-radius:14px;
  color:#111;
  text-decoration:none;
  font-weight:700;
  transition:.2s;
}
.nav a:hover{
  background:rgba(225,29,46,.06);
  transform:translateX(4px);
}

.pill{
  font-size:.72rem;
  padding:4px 10px;
  border-radius:999px;
  background:rgba(225,29,46,.1);
  color:var(--red);
}

/* ---------- Main ---------- */
.main{padding:20px}
.wrap{max-width:1150px;margin:auto}

.topbar{
  background:#fff;
  border-radius:24px;
  padding:20px;
  display:flex;
  justify-content:space-between;
  gap:16px;
  box-shadow:var(--shadow-soft);
}
.title h2{font-size:1.6rem;font-weight:900}
.title p{opacity:.65;font-weight:600}

.chip{
  padding:8px 14px;
  border-radius:999px;
  background:rgba(225,29,46,.08);
  border:1px solid var(--border);
  font-weight:800;
  color:var(--red);
}

/* ---------- Sections ---------- */
.sections{display:grid;gap:20px;margin-top:20px}

.section{
  background:#fff;
  border-radius:24px;
  padding:22px;
  box-shadow:var(--shadow-soft);
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.section-head h3{font-size:1.25rem;font-weight:900}

/* ---------- Games ---------- */
.games{display:grid;gap:14px}

.game{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  padding:16px;
  border-radius:20px;
  background:linear-gradient(180deg,#fff,#fff7f8);
  transition:.25s;
}
.game:hover{
  transform:translateY(-4px);
  box-shadow:var(--shadow-hover);
}
.left{display:flex;gap:12px;align-items:center}
.icon{
  width:46px;height:46px;
  border-radius:16px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(225,29,46,.1);
  font-size:1.3rem;
}
.txt h4{font-weight:900}
.txt p{font-size:.85rem;opacity:.65}

.go{
  background:linear-gradient(135deg,var(--red),var(--red2));
  color:#fff;
  padding:8px 16px;
  border-radius:14px;
  font-weight:900;
  text-decoration:none;
}

/* ---------- Footer ---------- */
.footer{
  margin-top:24px;
  text-align:center;
  opacity:.6;
  font-weight:700;
}

/* ---------- Responsive ---------- */
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{display:none}
}
@media(max-width:520px){
  .game{flex-direction:column;align-items:stretch}
  .go{text-align:center}
  .txt p{display:none}
}
</style>
</head>

<body>

<div class="app">

<!-- Sidebar -->
<aside class="sidebar">
  <div class="brand">
    <img src="logotrendy.svg">
    <h1>Trendy Plaza</h1>
  </div>

  <div class="side-actions">
    <a class="btn primary" href="lecteur.html">⟵ Retour</a>
    <a class="btn ghost" href="#">⚙️ Paramètres</a>
  </div>

  <div class="nav">
    <div class="nav-title">Catégories</div>
    <a href="#educatifs">🧠 Jeux éducatifs <span class="pill">3</span></a>
    <a href="#divertissants">🎮 Jeux divertissants <span class="pill">3</span></a>
    <a href="#collectifs">🧑‍🤝‍🧑 Jeux collectifs <span class="pill">3</span></a>
  </div>
</aside>

<!-- Main -->
<main class="main">
<div class="wrap">

<div class="topbar">
  <div class="title">
    <h2>🎮 Espace Jeux</h2>
    <p>Connectez-vous pour jouer et découvrir nos jeux.</p>
  </div>
  <span class="chip" id="authChip">Vérification…</span>
</div>

<div class="sections">

<section id="educatifs" class="section">
  <div class="section-head">
    <h3>🧠 Jeux éducatifs</h3>
    <span class="pill">Apprendre</span>
  </div>
  <div class="games">
    <div class="game">
      <div class="left">
        <div class="icon">🧩</div>
        <div class="txt">
          <h4>Mots croisés</h4>
          <p>Vocabulaire spécialisé</p>
        </div>
      </div>
      <a class="go play-link" href="MotsCroisés.html">Ouvrir</a>
    </div>
  </div>
</section>

</div>

<div class="footer">© 2025 Trendy Plaza</div>

</div>
</main>

</div>

<script>
const authChip=document.getElementById("authChip");
authChip.textContent="Non connecté ❌";
</script>

</body>
</html>
