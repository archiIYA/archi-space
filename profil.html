<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil utilisateur</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background: #f5f6fa;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .profile-card {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 350px;
      text-align: center;
    }
    h2 {
      margin-bottom: 20px;
      color: #333;
    }
    .profile-card input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 14px;
    }
    .profile-card button {
      background: #007bff;
      color: white;
      border: none;
      padding: 12px;
      width: 100%;
      margin-top: 15px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }
    .profile-card button:hover {
      background: #0056b3;
    }
    .logout {
      margin-top: 15px;
      background: #dc3545 !important;
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <h2>Mon Profil</h2>
    <input type="text" id="prenom" placeholder="Prénom" />
    <input type="text" id="nom" placeholder="Nom" />
    <input type="text" id="username" placeholder="Nom d'utilisateur" />
    <input type="text" id="universite" placeholder="Université" />
    <button onclick="saveProfile()">💾 Enregistrer</button>
    <button class="logout" onclick="logout()">🚪 Déconnexion</button>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>

  <script>
    // 🔥 Config Firebase (نفس الذي عندك)
    const firebaseConfig = {
      apiKey: "AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain: "archi-space-72624.firebaseapp.com",
      projectId: "archi-space-72624",
      storageBucket: "archi-space-72624.firebasestorage.app",
      messagingSenderId: "407015246505",
      appId: "1:407015246505:web:c914a78566b882b80df7b8",
      measurementId: "G-RZV7LSDQBD"
    };

    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ✅ تحميل بيانات البروفيل عند الدخول
    auth.onAuthStateChanged(user => {
      if (user) {
        const userRef = db.collection("users").doc(user.uid);
        userRef.get().then(doc => {
          if (doc.exists) {
            const data = doc.data();
            document.getElementById("prenom").value = data.prenom || "";
            document.getElementById("nom").value = data.nom || "";
            document.getElementById("username").value = data.username || "";
            document.getElementById("universite").value = data.universite || "";
          }
        });
      } else {
        window.location.href = "login.html"; // لو مش مسجل دخوله يرجع للتسجيل
      }
    });

    // ✅ حفظ بيانات البروفيل
    function saveProfile() {
      const user = auth.currentUser;
      if (user) {
        const userRef = db.collection("users").doc(user.uid);
        userRef.set({
          prenom: document.getElementById("prenom").value,
          nom: document.getElementById("nom").value,
          username: document.getElementById("username").value,
          universite: document.getElementById("universite").value
        }, { merge: true })
        .then(() => alert("Profil mis à jour ✅"))
        .catch(err => alert("Erreur: " + err));
      }
    }

    // ✅ تسجيل الخروج
    function logout() {
      auth.signOut().then(() => {
        window.location.href = "login.html";
      });
    }
  </script>
</body>
</html>
