<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil utilisateur</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background: #f5f6fa;
      margin: 0;
      padding: 30px;
    }
    .container {
      display: flex;
      gap: 30px;
      max-width: 1000px;
      margin: auto;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      flex: 1;
    }
    .profile-pic {
      width: 150px;
      height: 150px;
      border-radius: 10px;
      background: #3c3c55;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      color: white;
      margin: auto;
      overflow: hidden;
    }
    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .username {
      margin-top: 15px;
      font-weight: 600;
      font-size: 18px;
    }
    .email {
      color: #999;
      font-size: 14px;
    }
    button {
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 15px;
      width: 100%;
    }
    .btn-dark { background: #11152b; color: white; }
    .btn-dark:hover { background: #000; }
    .btn-outline { border: 1px solid orange; color: orange; background: transparent; }
    .btn-outline:hover { background: orange; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #b52a37; }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    #fileInput {
      display: none;
    }
  </style>
</head>
<body>

  <h2>Gérez votre profil :</h2>
  <div class="container">

    <!-- Left -->
    <div class="card" style="text-align:center">
      <div class="profile-pic" id="profilePic">M</div>
      <div class="username" id="usernameDisplay">---</div>
      <div class="email" id="emailDisplay">---</div>
      
      <input type="file" id="fileInput" accept="image/*" />
      <button class="btn-dark" onclick="document.getElementById('fileInput').click()">Modifier votre photo</button>
      <button class="btn-outline" onclick="resetPassword()">Modifier votre mot de passe</button>
    </div>

    <!-- Right -->
    <div class="card">
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="nom" placeholder="Nom"/>
      </div>
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" id="prenom" placeholder="Prénom"/>
      </div>
      <div class="form-group">
        <label>Nom d'utilisateur</label>
        <input type="text" id="username" placeholder="Nom d'utilisateur"/>
      </div>
      <div class="form-group">
        <label>Université</label>
        <input type="text" id="universite" placeholder="Université"/>
      </div>

      <button class="btn-dark" onclick="saveProfile()">Valider</button>
      <button class="btn-danger" onclick="deleteAccount()">Supprimer mon compte</button>
    </div>
  </div>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"></script>

  <script>
    // Config Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain: "archi-space-72624.firebaseapp.com",
      projectId: "archi-space-72624",
      storageBucket: "archi-space-72624.appspot.com",
      messagingSenderId: "407015246505",
      appId: "1:407015246505:web:c914a78566b882b80df7b8",
      measurementId: "G-RZV7LSDQBD"
    };
    const app = firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const storage = firebase.storage();

    let currentUserId = null;

    auth.onAuthStateChanged(user => {
      if (user) {
        currentUserId = user.uid;
        document.getElementById("emailDisplay").innerText = user.email;

        const userRef = db.collection("users").doc(user.uid);
        userRef.get().then(doc => {
          if (doc.exists) {
            const data = doc.data();
            document.getElementById("nom").value = data.nom || "";
            document.getElementById("prenom").value = data.prenom || "";
            document.getElementById("username").value = data.username || "";
            document.getElementById("universite").value = data.universite || "";
            document.getElementById("usernameDisplay").innerText = data.username || user.email.split("@")[0];

            if (data.photoURL) {
              document.getElementById("profilePic").innerHTML = `<img src="${data.photoURL}" alt="photo"/>`;
            } else {
              document.getElementById("profilePic").innerText = (data.username || user.email).charAt(0).toUpperCase();
            }
          } else {
            document.getElementById("usernameDisplay").innerText = user.email.split("@")[0];
            document.getElementById("profilePic").innerText = user.email.charAt(0).toUpperCase();
          }
        });
      } else {
        window.location.href = "login.html";
      }
    });

    // حفظ البيانات
    function saveProfile() {
      if (currentUserId) {
        const userRef = db.collection("users").doc(currentUserId);
        userRef.set({
          nom: document.getElementById("nom").value,
          prenom: document.getElementById("prenom").value,
          username: document.getElementById("username").value,
          universite: document.getElementById("universite").value
        }, { merge: true })
        .then(() => alert("✅ Profil mis à jour"))
        .catch(err => alert("Erreur: " + err));
      }
    }

    // إعادة تعيين كلمة السر
    function resetPassword() {
      const user = auth.currentUser;
      if (user) {
        auth.sendPasswordResetEmail(user.email)
          .then(() => alert("📩 Email de réinitialisation envoyé"))
          .catch(err => alert("Erreur: " + err));
      }
    }

    // رفع صورة جديدة
    document.getElementById("fileInput").addEventListener("change", e => {
      const file = e.target.files[0];
      if (file && currentUserId) {
        const storageRef = storage.ref("profilePics/" + currentUserId);
        storageRef.put(file).then(snapshot => {
          snapshot.ref.getDownloadURL().then(url => {
            db.collection("users").doc(currentUserId).set({ photoURL: url }, { merge: true });
            document.getElementById("profilePic").innerHTML = `<img src="${url}" alt="photo"/>`;
          });
        });
      }
    });

    // حذف الحساب
    function deleteAccount() {
      const user = auth.currentUser;
      if (user && confirm("⚠️ Voulez-vous vraiment supprimer votre compte ?")) {
        db.collection("users").doc(user.uid).delete().then(() => {
          user.delete().then(() => {
            alert("Compte supprimé");
            window.location.href = "signup.html";
          });
        });
      }
    }
  </script>
</body>
</html>
