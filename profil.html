<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil utilisateur</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background: #f5f6fa;
      margin: 0;
      transition: margin-left 0.3s;
    }
    /* Sidebar */
    .sidebar {
      height: 100%;
      width: 220px;
      position: fixed;
      top: 0;
      left: 0;
      background: #fff;
      color: #000;
      border-right: 1px solid #ccc;
      padding-top: 20px;
      z-index: 1000;
    }
    .sidebar-header {
      padding: 15px 20px;
      border-bottom: 1px solid #ccc;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .profile-mini {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .mini-pic {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      background: #000;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
    }
    .mini-username { font-size: 14px; font-weight: 600; }
    .mini-email { font-size: 12px; color: #555; }

    .closebtn {
      font-size: 20px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: #000;
    }

    .sidebar ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .sidebar ul li {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
    }
    .sidebar ul li a {
      color: #000;
      text-decoration: none;
      display: block;
    }
    .sidebar ul li:hover,
    .sidebar ul li.active,
    .sidebar ul li a:hover {
      background: #f0f0f0;
      border-radius: 6px;
    }

    /* Main */
    .main {
      margin-left: 220px;
      padding: 20px;
      transition: margin-left 0.3s;
    }

    /* Cards */
    .container {
      display: flex;
      gap: 30px;
      max-width: 1000px;
      margin: auto;
      flex-wrap: wrap;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      flex: 1;
      min-width: 280px;
    }
    .profile-pic {
      width: 150px;
      height: 150px;
      border-radius: 10px;
      background: #3c3c55;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      color: white;
      margin: auto;
      overflow: hidden;
    }
    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .username {
      margin-top: 15px;
      font-weight: 600;
      font-size: 18px;
    }
    .email {
      color: #999;
      font-size: 14px;
      margin-bottom: 20px;
    }
    button {
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 15px;
      width: 100%;
    }
    .btn-dark { background: #000; color: white; }
    .btn-dark:hover { background: #333; }
    .btn-outline { border: 1px solid orange; color: orange; background: transparent; }
    .btn-outline:hover { background: orange; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #b52a37; }
    .form-group { margin-bottom: 15px; }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    #fileInput { display: none; }

    /* Responsive */
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .sidebar { width: 180px; }
      .main { margin-left: 180px; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar" id="mySidebar">
    <div class="sidebar-header">
      <div class="profile-mini">
        <div class="mini-pic" id="miniPic">M</div>
        <div>
          <div class="mini-username" id="miniUsername">---</div>
          <div class="mini-email" id="miniEmail">---</div>
        </div>
      </div>
      <button class="closebtn" onclick="closeSidebar()">❌</button>
    </div>

    <ul>
      <li class="active">🏠 Accueil</li>
      <li>📊 Statistiques</li>
      <li>📚 Suivi Cours</li>
      <li><a href="courses.html">📖 Site des Cours</a></li>
      <li>❓ Sessions Questions</li>
      <li>📝 Sessions Examens</li>
      <li>🏷️ Labels</li>
      <li>🗒️ Notes</li>
      <li>🚩 Signals</li>
      <li>🔔 Notification</li>
      <li>💳 Abonnement</li>
      <li>🛠️ Support</li>
      <li><a href="profil.html">👤 Mon Profil</a></li>
    </ul>
  </div>

  <!-- Main -->
  <div class="main" id="mainContent">
    <h2>Gérez votre profil :</h2>

    <div class="container">
      <!-- Left -->
      <div class="card" style="text-align:center">
        <div class="profile-pic" id="profilePic">M</div>
        <div class="username" id="usernameDisplay">---</div>
        <div class="email" id="emailDisplay">---</div>
        
        <input type="file" id="fileInput" accept="image/*" />
        <button class="btn-dark" onclick="document.getElementById('fileInput').click()">Modifier votre photo</button>
        <button class="btn-outline">Modifier votre mot de passe</button>
      </div>

      <!-- Right -->
      <div class="card">
        <div class="form-group">
          <label>Nom</label>
          <input type="text" id="nom" placeholder="Nom"/>
        </div>
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" id="prenom" placeholder="Prénom"/>
        </div>
        <div class="form-group">
          <label>Nom d'utilisateur</label>
          <input type="text" id="username" placeholder="Nom d'utilisateur"/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="email" placeholder="Email"/>
        </div>
        <div class="form-group">
          <label>Université</label>
          <input type="text" id="universite" placeholder="Université"/>
        </div>

        <button class="btn-dark" onclick="saveProfile()">Valider</button>
        <button class="btn-danger">Supprimer mon compte</button>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script>
    function saveProfile() {
      let nom = document.getElementById("nom").value;
      let prenom = document.getElementById("prenom").value;
      let username = document.getElementById("username").value;
      let email = document.getElementById("email").value;

      document.getElementById("usernameDisplay").textContent = username || "---";
      document.getElementById("emailDisplay").textContent = email || "---";

      document.getElementById("miniUsername").textContent = username || "---";
      document.getElementById("miniEmail").textContent = email || "---";

      // أول حرف للصورة
      if (!document.querySelector("#profilePic img")) {
        document.getElementById("profilePic").textContent = username ? username[0].toUpperCase() : "M";
        document.getElementById("miniPic").textContent = username ? username[0].toUpperCase() : "M";
      }
    }

    // تحميل صورة
    document.getElementById("fileInput").addEventListener("change", function(e) {
      let file = e.target.files[0];
      if (file) {
        let reader = new FileReader();
        reader.onload = function(event) {
          document.getElementById("profilePic").innerHTML = `<img src="${event.target.result}" />`;
          document.getElementById("miniPic").textContent = ""; // نخليها فاضية لأن الصورة أخدت مكانها
        }
        reader.readAsDataURL(file);
      }
    });

    // إغلاق القائمة
    function closeSidebar() {
      document.getElementById("mySidebar").style.display = "none";
      document.getElementById("mainContent").style.marginLeft = "0";
    }
  </script>

</body>
</html>
