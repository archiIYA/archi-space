<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profil utilisateur - Archispace</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:'Rubik',sans-serif;
      background:var(--bg-color,#f8f9fb);color:var(--text-color,#1a1a1a);
      display:flex;min-height:100vh;transition:background .3s,color .3s}
    :root{--bg-color:#f8f9fb;--text-color:#1a1a1a;
      --card-bg:#fff;--btn-bg:#000;--btn-text:#fff}
    .dark-mode{--bg-color:#121212;--text-color:#ddd;--card-bg:#1e1e1e;--btn-bg:#444;--btn-text:#fff}
    .sidebar{width:220px;background:var(--card-bg);border-right:1px solid #ddd;
      padding-top:20px;display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;overflow-y:auto}
    .sidebar-header{padding:20px;border-bottom:1px solid #ddd;font-weight:700}
    ul.sidebar-nav{list-style:none;padding:0;margin:0;flex-grow:1}
    ul.sidebar-nav li{font-size:16px;padding:14px 22px;cursor:pointer;transition:.25s}
    ul.sidebar-nav li a{text-decoration:none;color:var(--text-color);display:block}
    ul.sidebar-nav li:hover,ul.sidebar-nav li.active,ul.sidebar-nav li a:hover{background:#f0f0f0;border-radius:8px}
    .main-content{flex-grow:1;margin-left:220px;padding:40px 30px;background:var(--bg-color);min-height:100vh}
    h2{font-weight:700;font-size:2rem;margin-bottom:2rem}
    .profile-grid{display:flex;gap:40px;max-width:1000px;margin:0 auto;flex-wrap:wrap}
    .profile-card{background:var(--card-bg);padding:30px;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.08);flex:1 1 300px;min-width:300px;display:flex;flex-direction:column;align-items:center;gap:16px}
    .profile-pic{width:160px;height:160px;background:#222;color:#fff;font-size:80px;font-weight:700;display:flex;justify-content:center;align-items:center;border-radius:16px}
    form{width:100%;display:flex;flex-direction:column;gap:20px}
    label{font-weight:600;color:#444;margin-bottom:6px;font-size:15px}
    input,select{width:100%;border:1.8px solid #ccc;padding:11px 15px;font-size:1rem;border-radius:10px;transition:border-color .3s;background:transparent}
    input:focus,select:focus{border-color:#000;background:#f7f7f7}
    .buttons-group{display:flex;gap:20px;flex-wrap:wrap;justify-content:space-between}
    button{flex:1 1 auto;padding:14px 20px;font-weight:700;border-radius:10px;cursor:pointer;transition:.3s;border:none;font-size:1rem}
    .save-btn{background:var(--btn-bg);color:var(--btn-text)}.save-btn:hover{background:#333}
    .delete-btn{background:#b22222;color:#fff}.delete-btn:hover{background:#800000}
    .dark-mode-toggle{position:fixed;top:15px;right:15px;background:#000;color:#fff;border:none;padding:10px 14px;cursor:pointer;border-radius:8px;font-weight:700}
    .dark-mode-toggle:hover{background:#333}
    @media(max-width:768px){.main-content{margin-left:0;padding:20px 15px}.profile-grid{flex-direction:column;gap:30px}.sidebar{width:0;display:none}.dark-mode-toggle{top:70px;right:15px}}
    /* إشعار */
    .notification{position:fixed;bottom:20px;right:20px;padding:14px 22px;border-radius:8px;font-weight:600;display:none;z-index:9999;box-shadow:0 4px 12px rgba(0,0,0,.15)}
    .notification.success{background:#28a745;color:#fff}
    .notification.error{background:#dc3545;color:#fff}
  </style>
</head>
<body>
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">ARCHISpace</div>
    <ul class="sidebar-nav">
      <li class="active">🏠 Accueil</li>
      <li>📊 Statistiques</li>
      <li><a href="courses.html">📚 Suivi Cours</a></li>
      <li>❓ Sessions Questions</li>
      <li><a href="exam.html">📝 Sessions Examens</a></li>
      <li>🏷️ Labels</li>
      <li>🗒️ Notes</li>
      <li>🚩 Signals</li>
      <li>🔔 Notification</li>
      <li><a href="abonement.html">💳 Abonnement</a></li>
      <li>🛠️ Support</li>
      <li><a href="profil.html">👤 Mon Profil</a></li>
    </ul>
  </nav>

  <button class="dark-mode-toggle" id="darkModeToggle">🌙 Mode nuit</button>

  <main class="main-content" id="mainContent">
    <h2>Mon profil</h2>
    <div class="profile-grid">
      <section class="profile-card">
        <div class="profile-pic" id="profilePic">A</div>
        <div class="username-display" id="usernameDisplay">---</div>
        <div class="email-display" id="emailDisplay">---</div>
      </section>
      <section class="profile-card">
        <form id="profileForm" autocomplete="off">
          <label for="nom">Nom</label>
          <input type="text" id="nom" required />
          <label for="prenom">Prénom</label>
          <input type="text" id="prenom" required />
          <label for="username">Nom d'utilisateur</label>
          <input type="text" id="username" required />
          <label for="email">Email</label>
          <input type="email" id="email" disabled />
          <label for="university">Université</label>
<select id="university" name="university" required>
  <option value="">Choisissez votre université</option>
  <option value="École Nationale Polytechnique d'Architecture et d'Urbanisme (ENAU), Alger">
    École Nationale Polytechnique d'Architecture et d'Urbanisme (ENAU), Alger
  </option>
  <option value="Université Constantine 3">Université Constantine 3</option>
  <option value="Université El Hadj Lakhdar, Batna">Université El Hadj Lakhdar, Batna</option>
  <option value="Université Ferhat Abbas, Sétif">Université Ferhat Abbas, Sétif</option>
  <option value="Université Larbi Ben M'hidi, Oum El Bouaghi">Université Larbi Ben M'hidi, Oum El Bouaghi</option>
  <option value="Université Abdelhak Benhamouda, Jijel">Université Abdelhak Benhamouda, Jijel</option>
  <option value="Université Amar Telidji, Laghouat">Université Amar Telidji, Laghouat</option>
  <option value="Université Hassiba Ben Bouali, Chlef">Université Hassiba Ben Bouali, Chlef</option>
  <option value="Université des Sciences et de la Technologie Mohamed Boudiaf, Oran">
    Université des Sciences et de la Technologie Mohamed Boudiaf, Oran
  </option>
  <option value="Université Abou Bekr Belkaïd, Tlemcen">Université Abou Bekr Belkaïd, Tlemcen</option>
  <option value="Université Mohamed Khider, Biskra">Université Mohamed Khider, Biskra</option>
  <option value="Université 8 Mai 1945, Guelma">Université 8 Mai 1945, Guelma</option>
  <option value="Université Badji Mokhtar, Annaba">Université Badji Mokhtar, Annaba</option>
  <option value="Université Larbi Tébessi, Tébessa">Université Larbi Tébessi, Tébessa</option>
  <option value="Université Saad Dahlab, Blida">Université Saad Dahlab, Blida</option>
  <option value="Université Mouloud Mammeri, Tizi Ouzou">Université Mouloud Mammeri, Tizi Ouzou</option>
  <option value="Université Abderrahmane Mira, Bejaia">Université Abderrahmane Mira, Bejaia</option>
  <option value="Université Ibn Badis, Mostaganem">Université Ibn Badis, Mostaganem</option>
  <option value="Université Béchar">Université Béchar</option>
</select>
          <div class="buttons-group">
            <button type="submit" class="save-btn">Enregistrer</button>
            <button type="button" class="delete-btn" id="deleteBtn">Supprimer mon compte</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <div id="notification" class="notification"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, deleteUser } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey:"AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain:"archi-space-72624.firebaseapp.com",
      projectId:"archi-space-72624",
      storageBucket:"archi-space-72624.appspot.com",
      messagingSenderId:"407015246505",
      appId:"1:407015246505:web:c914a78566b882b80df7b8",
    };
    const app=initializeApp(firebaseConfig);
    const auth=getAuth(app);
    const db=getFirestore(app);

    let currentUserId=null;let currentUserEmail=null;

    function showNotification(msg,type="success"){
      const n=document.getElementById("notification");
      n.textContent=msg;n.className="notification "+type;
      n.style.display="block";
      setTimeout(()=>{n.style.display="none"},2000);
    }

    onAuthStateChanged(auth,async(user)=>{
      if(user){
        currentUserId=user.uid;currentUserEmail=user.email;
        document.getElementById("email").value=currentUserEmail||"";
        const snap=await getDoc(doc(db,"students",currentUserId));
        if(snap.exists()){
          const data=snap.data();
          document.getElementById("nom").value=data.nom||"";
          document.getElementById("prenom").value=data.prenom||"";
          document.getElementById("username").value=data.username||"";
          document.getElementById("university").value=data.university||"";
          document.getElementById("usernameDisplay").textContent=data.username||"---";
          document.getElementById("emailDisplay").textContent=currentUserEmail||"---";
        }
      } else window.location.href="login.html";
    });

    document.getElementById("profileForm").addEventListener("submit",async(e)=>{
      e.preventDefault();
      if(!currentUserId){showNotification("Utilisateur non connecté","error");return;}
      const data={
        nom:document.getElementById("nom").value.trim(),
        prenom:document.getElementById("prenom").value.trim(),
        username:document.getElementById("username").value.trim(),
        university:document.getElementById("university").value.trim(),
        email:currentUserEmail
      };
      try{
        await setDoc(doc(db,"students",currentUserId),data,{merge:true});
        showNotification("✅ Profil enregistré avec succès ! ⏳ Redirection en cours...");
        setTimeout(()=>{window.location.href="lecteur.html"},2000);
      }catch(err){showNotification("Erreur : "+err.message,"error")}
    });

    document.getElementById("deleteBtn").addEventListener("click",async()=>{
      if(!currentUserId){showNotification("Utilisateur non connecté","error");return;}
      if(!confirm("Voulez-vous vraiment supprimer votre compte ?"))return;
      try{
        await deleteDoc(doc(db,"students",currentUserId));
        await deleteUser(auth.currentUser);
        showNotification("Compte supprimé avec succès ! ⏳ Redirection...");
        setTimeout(()=>{window.location.href="login.html"},2000);
      }catch(err){showNotification("Erreur : "+err.message,"error")}
    });
  </script>
</body>
</html>
