<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profil utilisateur</title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Rubik', sans-serif;
      background: #f5f6fa;
      margin: 0;
      transition: margin-left 0.3s;
    }
    /* Sidebar */
    .sidebar {
      height: 100%;
      width: 220px;
      position: fixed;
      top: 0;
      left: -220px;
      background: #11152b;
      padding-top: 60px;
      transition: 0.3s;
      z-index: 1000;
    }
    .sidebar a {
      display: block;
      color: white;
      padding: 12px 20px;
      text-decoration: none;
      font-size: 16px;
    }
    .sidebar a:hover {
      background: #1f2340;
    }
    .openbtn {
      font-size: 22px;
      cursor: pointer;
      background: #11152b;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 6px;
      margin: 10px;
    }
    .openbtn:hover { background: #000; }
    .sidebar.active {
      left: 0;
    }
    .main {
      transition: margin-left 0.3s;
      padding: 20px;
      margin-left: 0;
    }
    .sidebar.active ~ .main {
      margin-left: 220px;
    }

    /* Profile Cards */
    .container {
      display: flex;
      gap: 30px;
      max-width: 1000px;
      margin: auto;
      flex-wrap: wrap;
    }
    .card {
      background: #fff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      flex: 1;
      min-width: 280px;
    }
    .profile-pic {
      width: 150px;
      height: 150px;
      border-radius: 10px;
      background: #3c3c55;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      color: white;
      margin: auto;
      overflow: hidden;
    }
    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .username {
      margin-top: 15px;
      font-weight: 600;
      font-size: 18px;
    }
    .email {
      color: #999;
      font-size: 14px;
      margin-bottom: 20px;
    }
    button {
      border: none;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 15px;
      width: 100%;
    }
    .btn-dark { background: #11152b; color: white; }
    .btn-dark:hover { background: #000; }
    .btn-outline { border: 1px solid orange; color: orange; background: transparent; }
    .btn-outline:hover { background: orange; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-danger:hover { background: #b52a37; }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: 600;
    }
    input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    #fileInput { display: none; }
    /* Themes */
    .themes {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 20px;
    }
    .theme-btn {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      border: 2px solid #ccc;
      cursor: pointer;
    }
    .theme-btn.active {
      border: 3px solid black;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .container { flex-direction: column; }
      .sidebar { width: 180px; left: -180px; }
      .sidebar.active ~ .main { margin-left: 180px; }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar" id="mySidebar">
    <a href="#">🏠 Accueil</a>
    <a href="profil.html">👤 Profil</a>
    <a href="#">⚙️ Paramètres</a>
    <a href="#">🚪 Déconnexion</a>
  </div>

  <!-- Main -->
  <div class="main">
    <button class="openbtn" onclick="toggleSidebar()">☰ Menu</button>
    <h2>Gérez votre profil :</h2>

    <div class="container">
      <!-- Left -->
      <div class="card" style="text-align:center">
        <div class="profile-pic" id="profilePic">M</div>
        <div class="username" id="usernameDisplay">---</div>
        <div class="email" id="emailDisplay">---</div>
        
        <input type="file" id="fileInput" accept="image/*" />
        <button class="btn-dark" onclick="document.getElementById('fileInput').click()">Modifier votre photo</button>
        <button class="btn-outline" onclick="resetPassword()">Modifier votre mot de passe</button>

        <!-- اختيار الثيم -->
        <h4 style="margin-top:25px">Thème</h4>
        <div class="themes">
          <div class="theme-btn" id="theme1" style="background:#11152b"></div>
          <div class="theme-btn" id="theme2" style="background:#ff9800"></div>
          <div class="theme-btn" id="theme3" style="background:#2196f3"></div>
        </div>
      </div>

      <!-- Right -->
      <div class="card">
        <div class="form-group">
          <label>Nom</label>
          <input type="text" id="nom" placeholder="Nom"/>
        </div>
        <div class="form-group">
          <label>Prénom</label>
          <input type="text" id="prenom" placeholder="Prénom"/>
        </div>
        <div class="form-group">
          <label>Nom d'utilisateur</label>
          <input type="text" id="username" placeholder="Nom d'utilisateur"/>
        </div>
        <div class="form-group">
          <label>Université</label>
          <input type="text" id="universite" placeholder="Université"/>
        </div>

        <button class="btn-dark" onclick="saveProfile()">Valider</button>
        <button class="btn-danger" onclick="deleteAccount()">Supprimer mon compte</button>
      </div>
    </div>
  </div>

  <!-- JS Sidebar -->
  <script>
    function toggleSidebar() {
      document.getElementById("mySidebar").classList.toggle("active");
    }
  </script>

  <!-- Firebase (نفس السكريبت السابق: auth + firestore + storage + themes) -->
  <!-- ⚠️ هنا تحط نفس كود Firebase اللي أعطيتك في الرسالة السابقة -->
</body>
</html>
