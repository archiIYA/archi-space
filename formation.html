<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🎓 Formations </title>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#0b1020; --bg2:#0e1426; --card:#0f1a32; --text:#e8eef7; --muted:#9fb0c3;
      --accent:#22d3ee; --accent2:#38bdf8; --ring:#22d3ee55; --border:#1f2b44; --glass: color-mix(in srgb, var(--card) 78%, transparent);
    }
    :root.light{
      --bg:#f6f9ff; --bg2:#eaf2ff; --card:#ffffff; --text:#0d1629; --muted:#5f7088;
      --accent:#0ea5e9; --accent2:#22d3ee; --ring:#0ea5e955; --border:#d9e2f2; --glass: color-mix(in srgb, var(--card) 88%, transparent);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--text);
      font-family:'Rubik', ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial;
      background:
        radial-gradient(1200px 700px at 10% -10%, rgba(34,211,238,.10), transparent 60%),
        radial-gradient(800px 500px at 90% 10%, rgba(56,189,248,.10), transparent 60%),
        linear-gradient(135deg, var(--bg), var(--bg2) 60%);
      -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    }

    .container{max-width:1200px; margin:0 auto; padding:22px}
    .nav{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      background:var(--glass); border:1px solid var(--border); border-radius:16px; padding:10px 12px;
      backdrop-filter: blur(10px);
    }
    .brand{display:flex; align-items:center; gap:10px; font-weight:800}
    .logo{
      width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:20px;
      background:
        radial-gradient(120% 120% at 0% 0%, var(--accent) 0%, transparent 60%),
        radial-gradient(120% 120% at 100% 100%, var(--accent2) 0%, transparent 60%);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent2) 35%, transparent),
                  0 10px 24px color-mix(in srgb, var(--accent) 28%, transparent);
    }
    .controls{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
    .btn{
      appearance:none; border:1px solid var(--border); background:var(--card); color:var(--text);
      border-radius:12px; padding:9px 12px; cursor:pointer; font-weight:600; display:inline-flex; align-items:center; gap:8px;
      transition: .2s transform ease, .2s box-shadow ease, .2s background ease;
      text-decoration:none;
    }
    .btn:hover{transform:translateY(-1px); box-shadow:0 6px 16px rgba(0,0,0,.18)}
    .btn:active{transform:translateY(0)}
    .btn-primary{background:linear-gradient(135deg, var(--accent), var(--accent2)); color:#001018; border:none;}

    .hero{
      position:relative; overflow:hidden; margin:18px 0; border-radius:16px;
      border:1px solid var(--border); background:linear-gradient(180deg, var(--glass), transparent);
      padding:20px; display:grid; gap:10px;
    }
    .hero h1{margin:0; font-size:28px; font-weight:800}
    .hero p{margin:0; color:var(--muted)}
    .blob{position:absolute; inset:auto -20% -40% auto; width:420px; height:420px; filter: blur(60px);
      background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 60%, transparent), transparent 70%);
      opacity:.35; pointer-events:none; transform: rotate(18deg);
    }
    .grid{
      display:grid; grid-template-columns:repeat(12, 1fr); gap:18px; margin-top:14px;
    }
    .card{
      grid-column: span 12;
      background:linear-gradient(180deg, var(--glass), color-mix(in srgb, var(--card) 92%, transparent));
      border:1px solid var(--border); border-radius:16px; padding:16px;
      display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit;
      transition:.25s transform ease, .25s border-color ease, .25s box-shadow ease;
    }
    .card:hover{
      transform:translateY(-4px);
      border-color: color-mix(in srgb, var(--accent) 48%, var(--border));
      box-shadow: 0 14px 36px rgba(0,0,0,.18);
    }
    .logo-slot{
      width:64px; height:64px; border-radius:14px; display:grid; place-items:center; flex:0 0 auto;
      background: color-mix(in srgb, var(--card) 70%, transparent);
      border:2px dashed color-mix(in srgb, var(--border) 90%, transparent);
      font-size:12px; color:var(--muted); letter-spacing:.2px; text-align:center; padding:6px;
      overflow:hidden;
    }

    .logo-slot img{
      max-width:85%;
      max-height:85%;
      object-fit:contain;
      display:block;
    }

    .body{flex:1; min-width:0}
    .title{font-weight:800; font-size:18px; margin-bottom:4px}
    .desc{color:var(--muted); font-size:14px}
    .price{margin-top:6px; font-weight:800; font-size:15px}
    .actions{display:flex; gap:10px; flex-wrap:wrap}
    .card .cta{ margin-left:auto; }

    @media (min-width:600px){ .card{grid-column: span 6;} }
    @media (min-width:980px){ .card{grid-column: span 4;} }
  </style>
</head>
<body>
  <div class="container">
    <nav class="nav">
      <div class="brand">
        <div class="logo" aria-hidden="true">🎓</div>
        <div>Formations</div>
      </div>
      <div class="controls">
        <a class="btn" href="trendyservice.html"> Trendy Service</a>
        <a class="btn" href="lecteur.html">🏠 Accueil</a>
        <button id="themeToggle" class="btn" title="Basculer thème">🌗 Mode</button>
        <button id="logoutBtn" class="btn">🚪 Se déconnecter</button>
      </div>
    </nav>

    <section class="hero">
      <h1>Catalogue des formations</h1>
      <p>Accédez à des parcours structurés et pratiques.</p>
      <div class="blob" aria-hidden="true"></div>
    </section>

    <section id="grid" class="grid" aria-live="polite">
    </section>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBt4gf4Gan57N3M1PPQhWl5uXxp1Jcrkvk",
      authDomain: "archi-space-72624.firebaseapp.com",
      projectId: "archi-space-72624",
      storageBucket: "archi-space-72624.firebasestorage.app",
      messagingSenderId: "407015246505",
      appId: "1:407015246505:web:c914a78566b882b80df7b8",
      measurementId: "G-RZV7LSDQBD"
    };

    const appFB = initializeApp(firebaseConfig);
    const auth = getAuth(appFB);

    const logoutBtn = document.getElementById("logoutBtn");
    logoutBtn.addEventListener("click", async () => {
      await signOut(auth);
      window.location.href = "login.html";
    });

    onAuthStateChanged(auth, (user) => {
      if (!user){
        const redirect = encodeURIComponent("formation.html");
        window.location.href = `login.html?redirect=${redirect}`;
        return;
      }
      initGrid();
    });

    const root = document.documentElement;
    const THEME_KEY = "archispace-theme";
    const setTheme = (mode) => {
      if (mode === "light") root.classList.add("light");
      else root.classList.remove("light");
      localStorage.setItem(THEME_KEY, mode);
    };
    setTheme(localStorage.getItem(THEME_KEY) || "dark");
    document.getElementById("themeToggle").addEventListener("click", () => {
      setTheme(root.classList.contains("light") ? "dark" : "light");
    });

    const courses = [
      { slug:"autocad",   title:"AutoCAD",   logo:"autocad.svg",   desc:"2D/3D, calques, blocs dynamiques, workflow pro.",           price:"3000DA", link:"autocad.html" },
      { slug:"photoshop", title:"Photoshop", logo:"photoshop.svg", desc:"Retouche, compositing, post-prod architecturale.",         price:"3000DA", link:"photoshop.html" },
      { slug:"archicad",  title:"ArchiCAD",  logo:"archicad.svg",  desc:"BIM, maquettes, feuilles de plans et nomenclatures.",      price:"5000DA", link:"archicad.html" },
      { slug:"revit",     title:"Revit",     logo:"revit.svg",     desc:"BIM, familles, phasage, quantitatifs et collaboration.",   price:"5000DA", link:"revit.html" },
      { slug:"sketchup",  title:"SketchUp",  logo:"sketchup.svg",  desc:"Modélisation rapide, organisation, exports.",              price:"3000DA", link:"sketchup.html" },
      { slug:"3dsmax",    title:"3ds Max",   logo:"3ds max.svg",   desc:"Modélisation avancée, scènes réalistes, pipeline rendu.",  price:"5000DA", link:"3dsmax.html" },
      { slug:"rhino3d",   title:"Rhino 3D",  logo:"rhion 3d.svg",  desc:"NURBS, formes complexes, paramétrique de base.",          price:"5000DA", link:"rhino3d.html" },
      { slug:"vray",      title:"V-Ray",     logo:"v ray.svg",     desc:"Matériaux, lumières, caméras, rendu photoréaliste.",       price:"5000DA",  link:"vray.html" },
      { slug:"lumion",    title:"Lumion",    logo:"lumion.svg",    desc:"Rendu temps réel et storytelling extérieur/intérieur.",    price:"5000DA", link:"lumion.html" },
      { slug:"enscape",   title:"Enscape",   logo:"Enscape.svg",   desc:"Rendu instantané, VR et visites immersives.",              price:"5000DA", link:"enscape.html" },
      { slug:"MAPINFO",   title:"MAPINFO",   logo:"mapinfo.svg",   desc:"Rendu instantané, VR et visites immersives.",              price:"5000DA", link:"enscape.html" }
    ];

    function card(course){
      const a = document.createElement("a");
      a.className = "card";
      a.href = course.link;
      a.setAttribute("data-price", course.price);

      a.innerHTML = `
        <div class="logo-slot">
          ${course.logo ? `<img src="${course.logo}" alt="${course.title} logo">` : "LOGO"}
        </div>
        <div class="body">
          <div class="title">${course.title}</div>
          <div class="desc">${course.desc}</div>
          <div class="price">Prix : <span class="priceValue">${course.price}</span></div>
        </div>
        <span class="btn btn-primary cta">Accéder</span>
      `;
      return a;
    }

    function initGrid(){
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      courses.forEach(c => grid.appendChild(card(c)));
    }
  </script>
</body>
</html>
