<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>🎓 Formations </title>

  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet"/>

  <style>
    :root{
      --bg:#0b1020; --bg2:#0e1426; --card:#0f1a32; --text:#e8eef7; --muted:#9fb0c3;
      --accent:#22d3ee; --accent2:#38bdf8; --ring:#22d3ee55; --border:#1f2b44;
      --glass: color-mix(in srgb, var(--card) 78%, transparent);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--text);
      font-family:'Rubik',sans-serif;
      background:
        radial-gradient(1200px 700px at 10% -10%, rgba(34,211,238,.10), transparent 60%),
        radial-gradient(800px 500px at 90% 10%, rgba(56,189,248,.10), transparent 60%),
        linear-gradient(135deg, var(--bg), var(--bg2) 60%);
    }

    .container{max-width:1200px; margin:0 auto; padding:22px}

    .nav{
      display:flex; align-items:center; justify-content:space-between;
      background:var(--glass); border:1px solid var(--border);
      border-radius:16px; padding:10px 12px;
      backdrop-filter: blur(10px);
    }

    .brand{display:flex; align-items:center; gap:10px; font-weight:800}

    .logo{
      width:42px; height:42px; border-radius:12px; display:grid; place-items:center;
      background:
        radial-gradient(120% 120% at 0% 0%, var(--accent) 0%, transparent 60%),
        radial-gradient(120% 120% at 100% 100%, var(--accent2) 0%, transparent 60%);
      box-shadow:
        0 0 0 2px color-mix(in srgb, var(--accent2) 35%, transparent),
        0 10px 24px color-mix(in srgb, var(--accent) 28%, transparent);
    }

    #grid{
      margin-top:25px;
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(260px,1fr));
      gap:20px;
    }

    .card{
      display:flex; flex-direction:column; gap:10px;
      background:var(--glass);
      border:1px solid var(--border);
      padding:18px; border-radius:14px;
      text-decoration:none; color:var(--text);
      transition:.25s;
    }
    .card:hover{
      transform:translateY(-4px);
      box-shadow:0 12px 28px rgba(0,0,0,.25);
    }

    .logo-slot{
      width:52px; height:52px; border-radius:12px;
      background:#101a33;
      display:flex; align-items:center; justify-content:center;
      padding:6px;
      border:1px solid var(--border);
    }
    .logo-slot img{
      width:100%; height:100%; object-fit:contain;
    }

    .title{font-size:18px; font-weight:700; margin-bottom:4px}
    .desc{color:var(--muted); font-size:14px; line-height:1.5}
    .price{margin-top:6px; font-weight:600}

    .btn-primary{
      margin-top:auto;
      display:inline-block; padding:9px 12px;
      border-radius:10px; font-weight:700;
      background:linear-gradient(135deg, var(--accent), var(--accent2));
      text-align:center; color:#001018;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="nav">
      <div class="brand">
        <div class="logo">🎓</div>
        <span>Formations Professionnelles</span>
      </div>
    </div>

    <div id="grid"></div>
  </div>

  <script>
    const courses = [
      { slug:"autocad", title:"AutoCAD", logo:"autocad.svg",
        desc:"2D/3D, calques, blocs dynamiques, workflow pro.", price:"3000DA", link:"autocad.html" },

      { slug:"photoshop", title:"Photoshop", logo:"photoshop.svg",
        desc:"Retouche, compositing, post-prod architecturale.", price:"3000DA", link:"photoshop.html" },

      { slug:"archicad", title:"ArchiCAD", logo:"archicad.svg",
        desc:"BIM, maquettes, feuilles de plans et nomenclatures.", price:"5000DA", link:"archicad.html" },

      { slug:"revit", title:"Revit", logo:"revit.svg",
        desc:"BIM, familles, phasage, quantitatifs et collaboration.", price:"5000DA", link:"revit.html" },

      { slug:"sketchup", title:"SketchUp", logo:"sketchup.svg",
        desc:"Modélisation rapide, organisation, exports.", price:"3000DA", link:"sketchup.html" },

      { slug:"3dsmax", title:"3ds Max", logo:"3ds max.svg",
        desc:"Modélisation avancée, scènes réalistes, pipeline rendu.", price:"5000DA", link:"3dsmax.html" },

      { slug:"rhino3d", title:"Rhino 3D", logo:"rhion 3d.svg",
        desc:"NURBS, formes complexes, paramétrique de base.", price:"5000DA", link:"rhino3d.html" },

      { slug:"vray", title:"V-Ray", logo:"v ray.svg",
        desc:"Matériaux, lumières, caméras, rendu photoréaliste.", price:"5000DA", link:"vray.html" },

      { slug:"lumion", title:"Lumion", logo:"lumion.svg",
        desc:"Rendu temps réel et storytelling extérieur/intérieur.", price:"5000DA", link:"lumion.html" },

      { slug:"enscape", title:"Enscape", logo:"Enscape.svg",
        desc:"Rendu instantané, VR et visites immersives.", price:"5000DA", link:"enscape.html" },

      { slug:"mapinfo", title:"MAPINFO", logo:"mapinfo.svg",
        desc:"Rendu instantané, VR et visites immersives.", price:"5000DA", link:"enscape.html" }
    ];


    function card(course){
      const a = document.createElement("a");
      a.className = "card";
      a.href = course.link;
      a.setAttribute("data-price", course.price);

      a.innerHTML = 
        <div class="logo-slot">
          <img src="${course.logo}" alt="${course.title}">
        </div>

        <div class="title">${course.title}</div>
        <div class="desc">${course.desc}</div>
        <div class="price">Prix : <span>${course.price}</span></div>

        <span class="btn-primary">Accéder</span>
      ;

      return a;
    }

    function initGrid(){
      const grid = document.getElementById("grid");
      grid.innerHTML = "";
      courses.forEach(c => grid.appendChild(card(c)));
    }

    initGrid();
  </script>
</body>
</html>
